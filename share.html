<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>IRON · Training summary</title>
<style>
:root{--bg:#F4F5FF;--sf:#fff;--sf2:#EEF0FF;--ink:#191A4A;--mu:#5E6191;--ln:#E1E3F7;--up:#2F5BFF;--ok:#12B76A;--warn:#F59E0B;--bad:#EF3B55}
@media (prefers-color-scheme:dark){:root{--bg:#0E0F24;--sf:#17183A;--sf2:#202250;--ink:#E8E9FF;--mu:#A2A5D6;--ln:#2B2D60}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}h1{font-size:28px;margin:0 0 2px;letter-spacing:-.02em}h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--mu);margin:0 0 16px}.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:var(--sf2);border-radius:12px;padding:10px 12px}.stat b{font-size:22px;display:block}.stat span{font-size:13px;color:var(--mu)}
details{border-top:1px solid var(--ln);padding:10px 0}details summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;list-style:none}details summary::-webkit-details-marker{display:none}
.ex{margin:8px 0 0}.ex b{font-size:14px}.sets{font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.lift{display:grid;grid-template-columns:1fr 120px auto;gap:10px;align-items:center;border-top:1px solid var(--ln);padding:8px 0;font-size:14px}.lift .num{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.muted{color:var(--mu)}.err{text-align:center;padding:60px 20px}
svg text{font-family:inherit}
</style></head><body><main id="app"><p class="muted">Opening…</p></main>
<script src="share.js"></script></body></html>
