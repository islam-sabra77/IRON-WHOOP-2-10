<style>
:root{
  --bg:#F3F5FF;--sf:#FFFFFF;--sf2:#EBEEFF;--ink:#191A4A;--mu:#5E6390;--ln:#DCE1F7;
  --upper:#2F5BFF;--lower:#FF6A13;--mob:#00B39A;--core:#E8A900;--cardio:#FF2D78;--long:#7B4DFF;--rest:#8E97BF;--travel:#00A3FF;--warm:#43A512;
  --ok:#12B76A;--warn:#F59E0B;--bad:#EF3B55;
  --shadow:0 1px 0 rgba(25,26,74,.04),0 6px 18px rgba(47,91,255,.07);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F2E;--sf:#181A45;--sf2:#23265C;--ink:#EEF0FF;--mu:#A5AAD8;--ln:#2D3170;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0F2E;--sf:#181A45;--sf2:#23265C;--ink:#EEF0FF;--mu:#A5AAD8;--ln:#2D3170;--shadow:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--upper);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 170px}
.disp{font-stretch:68%;font-weight:850;letter-spacing:-.01em;line-height:.95}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mu)}
.hide{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topin{max-width:760px;margin:0 auto;padding:10px 14px 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{margin:0;font-size:26px}
.brand h1 img.wm{width:auto!important;height:26px!important;border-radius:0!important;box-shadow:none!important;border:0!important;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wm{filter:invert(1) brightness(1.2)}}
:root[data-theme="dark"] .wm{filter:invert(1) brightness(1.2)}
.brand h1.brandlogo{min-height:42px;display:flex;align-items:center;gap:10px;letter-spacing:.06em}.brand h1 img{width:38px;height:38px;border-radius:10px;box-shadow:0 1px 6px rgba(25,26,74,.18);border:1px solid var(--ln)}
.brand h1 i{font-style:normal;display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--lower);margin-right:4px;box-shadow:14px 0 0 var(--upper),28px 0 0 var(--cardio);margin-right:36px;vertical-align:2px}
.icbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center}
.icbtn svg{width:20px;height:20px}
.strip{display:flex;align-items:center;gap:6px;margin-top:10px}
.strip .arrow{flex:0 0 34px;height:58px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-size:18px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dchip{height:58px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;position:relative}
.dchip small{font-size:11px;color:var(--mu);font-weight:600}
.dchip b{font-size:17px;font-weight:800}
.dchip .bar{width:18px;height:4px;border-radius:2px;background:var(--c,transparent)}
.dchip.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dchip.sel small{color:inherit;opacity:.75}
.dchip.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--cardio)}
.dchip.done .bar{height:6px;width:24px}
.dchip.off{opacity:.4}
.weeklab{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--mu);font-weight:600}
.linkbtn{border:0;background:none;color:var(--upper);font-weight:700;padding:4px 0}

/* hero */
.hero{--c:var(--upper);background:var(--c);color:#fff;border-radius:26px;padding:18px 18px 16px;margin:10px 0 14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .when{font-size:14px;font-weight:600;opacity:.92;position:relative}
.hero h2{font-size:clamp(50px,15vw,76px);margin:6px 0 2px;position:relative}
.hero .focus{font-size:18px;font-weight:700;position:relative}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative}
.tag{font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.2)}
.seg{display:flex;gap:4px;margin-top:16px;position:relative}
.seg>div{height:12px;border-radius:6px;background:rgba(255,255,255,.28);overflow:hidden;min-width:14px}
.seg>div>span{display:block;height:100%;background:#fff;border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.seglab{display:flex;gap:4px;margin-top:6px;font-size:12px;font-weight:700;position:relative}
.seglab>span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:14px;opacity:.92}
.hero-actions{display:flex;gap:8px;margin-top:14px;position:relative;flex-wrap:wrap}
.sechead{width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.chev{flex:0 0 30px;height:30px;border-radius:9px;background:var(--sf2);display:grid;place-items:center;transition:transform .2s}
.chev svg{width:16px;height:16px}
.closed .chev{transform:rotate(-90deg)}
.csum{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:4px 12px;margin-bottom:10px}
.crow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--ln);font-size:14px;font-weight:650}
.crow:first-child{border-top:0}
.crow .l2{font-size:11.5px;font-weight:850;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:7px;text-align:center;padding:3px 0}
.crow b{font-size:12.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.crow.full b{color:var(--ok)}
.crow.full span:nth-child(2){text-decoration:line-through;text-decoration-color:var(--ok);opacity:.7}
.exh{cursor:pointer}
.exh .chev{margin-left:auto}
.ex.shut .exh .chev{transform:rotate(-90deg)}
.prog-chip{display:inline-block;margin-top:4px;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--sf2);color:var(--mu)}
.ex.complete .prog-chip{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.chead h4,.chead h5{margin:0!important}
.chead+*{margin-top:10px}
.tvcard{border-radius:24px;overflow:hidden;margin-bottom:12px;background:var(--sf);border:1px solid var(--ln);box-shadow:var(--shadow)}
.tvtop{background:var(--travel);color:#fff;padding:14px 16px;position:relative;overflow:hidden}
.tvtop::after{content:"";position:absolute;right:-30px;bottom:-50px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14)}
.tvtop h3{margin:2px 0 0;font-size:44px}
.tvtop .focus{font-weight:700;font-size:15px}
.tvtop .tags{margin-top:8px}
.tvbody{padding:10px 14px 14px}
.tvbody .grp{font-size:13px;font-weight:800;color:var(--mu);margin:10px 0 2px}
.trip{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.trip div{flex:1}
.trip span{display:block;font-size:12.5px;color:var(--mu)}
.fl{font-size:12.5px;font-weight:750;color:var(--mu)}
.fl{display:block}.grid2>*{min-width:0}input[type=date]{min-width:0;max-width:100%;display:block;-webkit-appearance:none;appearance:none}
.hbtn{border:0;border-radius:12px;padding:9px 13px;font-weight:750;font-size:14px;background:rgba(255,255,255,.22);color:#fff}
.hbtn.solid{background:#fff;color:var(--c)}
.big-pct{position:absolute;right:18px;top:16px;font-size:34px;text-align:right}
.big-pct small{display:block;font-size:12px;font-stretch:100%;font-weight:700;opacity:.85}

/* readiness */
.ready{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px;align-items:center;margin:0 0 14px}
.ready>span{font-size:13px;font-weight:700;color:var(--mu);padding-right:4px}
.rbtn{min-height:52px;border:1.5px solid var(--ln);background:var(--sf);border-radius:12px;padding:8px 4px;font-size:13px;font-weight:750;line-height:1.15}
.rbtn small{display:block;font-weight:600;font-size:11px;color:var(--mu)}
.rbtn[data-v="g"].on{background:var(--ok);border-color:var(--ok);color:#fff}
.rbtn[data-v="y"].on{background:var(--warn);border-color:var(--warn);color:#fff}
.rbtn[data-v="r"].on{background:var(--bad);border-color:var(--bad);color:#fff}
.rbtn.on small{color:#fff;opacity:.9}

/* sections */
.sec{margin:18px 0 8px}
.sechead{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.sechead .sq{width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px}
.sechead h3{margin:0;font-size:26px;flex:1}
.sechead .cnt{font-size:13px;font-weight:750;color:var(--mu);text-align:right;line-height:1.2}
.note{background:var(--sf2);border-radius:14px;padding:10px 12px;font-size:14px;margin:0 0 10px}
.note b{font-weight:800}

/* mobility rows */
.mlist{background:var(--sf);border-radius:20px;border:1px solid var(--ln);overflow:hidden;box-shadow:var(--shadow)}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--ln)}
.mrow:first-child{border-top:0}
.mrow.done .mi b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--mob);opacity:.6}
.mi{flex:1;min-width:0}
.mi b{display:block;font-weight:750;font-size:15px}
.mi span{font-size:13px;color:var(--mu)}
.mi details summary{list-style:none;cursor:pointer}
.mi details summary::-webkit-details-marker{display:none}
.mi .cue{font-size:13px;margin-top:4px;color:var(--ink)}
.chipinj{display:inline-block;font-size:11px;font-weight:750;padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--mob)) 15%,transparent);color:var(--c,var(--mob));margin:3px 4px 0 0}
.tick{flex:0 0 40px;width:40px;height:40px;border-radius:12px;border:2px solid var(--ln);background:var(--sf);display:grid;place-items:center;padding:0}
.tick svg{width:20px;height:20px;opacity:0}
.tick.on{background:var(--c,var(--ok));border-color:var(--c,var(--ok));color:#fff}
.tick.on svg{opacity:1}
.mini{border:1px solid var(--ln);background:var(--sf2);border-radius:10px;height:36px;min-width:36px;padding:0 9px;font-size:13px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;white-space:nowrap}
.mini svg{width:16px;height:16px}
.mini.play{background:var(--c,var(--mob));border-color:transparent;color:#fff}
.mini.yt{color:#E11D48}

/* exercise cards */
.block{margin:0 0 12px;position:relative}
.block.ss{background:color-mix(in srgb,var(--c) 9%,var(--bg));border-radius:24px;padding:10px;border:1.5px dashed color-mix(in srgb,var(--c) 45%,transparent)}
.sslab{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;color:var(--c);padding:2px 6px 8px}
.ex{background:var(--sf);border-radius:20px;border:1px solid var(--ln);padding:12px;box-shadow:var(--shadow)}
.block.ss .ex+.ex{margin-top:8px}
.exh{display:flex;gap:10px;align-items:flex-start}

.habh{display:flex;align-items:center;gap:10px}
.emo{flex:0 0 46px;height:46px;border-radius:14px;background:color-mix(in srgb,var(--c) 18%,transparent);display:grid;place-items:center;font-size:24px}
.habh .mi b{font-size:17px}
.hcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.hday{aspect-ratio:1;border-radius:10px;border:0;background:var(--sf2);font-size:13px;font-weight:750;padding:0}
.hday.on{background:var(--c);color:#fff}
.hday.fut{opacity:.35;pointer-events:none}
.hday.blank{background:transparent;pointer-events:none}
.hday.today{box-shadow:inset 0 0 0 2px var(--ink)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.mnav b{font-size:15px}
.todayrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tchip{flex:0 0 auto;border:1.5px solid var(--ln);background:var(--sf);border-radius:99px;padding:8px 14px 8px 10px;font-weight:750;font-size:14px;display:flex;gap:6px;align-items:center}
.tchip.on{background:var(--c);border-color:var(--c);color:#fff}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sw.on{border-color:var(--ink)}
.emopick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.emopick button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf2);font-size:20px}
.emopick button.on{border-color:var(--ink)}
.hstat{display:flex;gap:14px;font-size:12.5px;color:var(--mu);font-weight:650;margin-top:2px}
.hstat b{color:var(--ink);display:inline!important;font-size:inherit!important}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabsin{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tab span{font-size:10.5px;letter-spacing:-.01em;white-space:nowrap}
.tab{border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mu)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--cardio)}

/* timer */
.timer{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:45;max-width:740px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:22px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 34px rgba(25,26,74,.35)}
.timer .tt{flex:1;min-width:0}
.timer .tt small{display:block;font-size:12px;font-weight:700;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .tt b{display:block;font-size:34px;line-height:1}
.timer{gap:8px}.timer button{flex:0 0 auto;border:0;border-radius:11px;height:38px;min-width:38px;padding:0 7px;background:rgba(127,127,160,.3);color:inherit;font-weight:800;font-size:13px}
.timer .ringt circle{transition:stroke-dashoffset .25s linear}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(14,15,46,.45)}
.panel{overscroll-behavior:contain;position:relative;background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.panel h4{margin:0 0 4px;font-size:30px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 12px;position:relative;cursor:grab}.grab::before{content:"";position:absolute;inset:-12px -30px}
.opt{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px;margin:8px 0}
.opt b{display:block;font-size:16px}
.opt span{font-size:13px;color:var(--mu)}
.opt .row2{display:flex;gap:8px;margin-top:10px}
.opt .row2 button{flex:1;height:40px;border-radius:11px;border:0;font-weight:800;background:var(--sf2)}
.opt .row2 button.p{background:var(--c,var(--upper));color:#fff}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:750;font-size:14px;z-index:80;display:flex;gap:10px;align-items:center;max-width:92vw}
.toast button{border:0;background:var(--cardio);color:#fff;border-radius:9px;padding:5px 10px;font-weight:800}
.celebrate{text-align:center;padding:6px 0}
.celebrate .disp{font-size:64px;color:var(--ok)}
.burst{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}
.burst i{width:14px;height:14px;border-radius:4px;background:var(--c);animation:pop .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{0%{transform:translateY(20px) scale(.2) rotate(0)}100%{transform:none}}
.bar2{height:10px;border-radius:5px;background:var(--sf2);overflow:hidden}
.bar2 span{display:block;height:100%;background:var(--c)}
.ext-rec{border-left:5px solid var(--c);padding-left:10px;margin:10px 0}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
/* moves (mobility & warm-up) */
.mv{border-top:1px solid var(--ln)}
.mv:first-child{border-top:0}
.mvh{display:flex;align-items:center;gap:10px;padding:10px 12px}
.mvh .mi{cursor:pointer}
.mv.done .mi b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--c);opacity:.6}
.chevbtn{flex:0 0 34px;width:34px;height:34px;border-radius:10px;border:0;background:var(--sf2);display:grid;place-items:center;padding:0;transition:transform .2s}
.chevbtn svg{width:16px;height:16px}
.mv.shut .chevbtn{transform:rotate(-90deg)}
.mvb{padding:0 12px 12px 62px}
.mvb .cue{font-size:13.5px}
.mvb .tools{margin-top:8px}
.thumb{float:right;width:92px;height:74px;margin:0 0 6px 10px;border-radius:12px;background:color-mix(in srgb,var(--c) 12%,var(--sf));color:var(--ink);border:0;padding:0;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.thumb i{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.thumb i svg{width:11px;height:11px;color:#fff;fill:#fff}
.mini.demo{background:var(--c);border-color:transparent;color:#fff}
/* player */
.stage{border-radius:22px;background:color-mix(in srgb,var(--c) 11%,var(--sf));color:var(--ink);margin:10px 0 8px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto;aspect-ratio:240/190}
.stage.vid{background:#000;display:flex;justify-content:center}
.stage.vid iframe{display:block;border:0;height:min(64vh,600px);aspect-ratio:9/16;width:auto;max-width:100%}
.pview{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sf2);border-radius:14px;padding:4px;margin-top:8px}
.pview button{border:0;border-radius:11px;height:38px;font-weight:800;background:none}
.pview button.on{background:var(--sf);box-shadow:var(--shadow)}
.pctl{display:flex;gap:8px;flex-wrap:wrap}
.pctl button,.pctl label{flex:1;min-width:110px;height:44px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.pctl .p{background:var(--c);border-color:var(--c);color:#fff}
.pnote{font-size:12.5px;color:var(--mu);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:640px){.set{grid-template-columns:30px 1fr 1fr 48px}}
</style>

const WK_OFF=[0,1,2,0,1];                 // rep target added each week
const WK_MAINSET=[0,0,0,1,1];             // extra set on main lifts in weeks 4-5

function extAt(d){return S.ext.find(x=>d>=x.from&&d<=x.to)||null}

  const ph=phaseOf(d),off=ph.deload?0:WK_OFF[ph.pos];

    const v=isT?dose+(ph.deload?0:add*5):String(dose+(ph.deload?0:add));return{sets,reps:v,rir:ph.rir,rest:60}}
  const sc=SCH[ph.s];let[sets,base]=sc[role];let rir=ph.rir;

  if(role==='main'&&!ph.deload)sets+=WK_MAINSET[ph.pos];
  const ex=extAt(d);if(ex&&ex.vol>0&&role==='arm')sets+=1;if(ex&&ex.vol<0&&(role==='acc'||role==='arm'))sets-=1;
  if(ph.deload){sets=2;rir='4'}

}

function renderTabs(){
  const tabs=[['train','Train',IC.train],['travel','Travel',IC.travel],['plan','Plan',IC.plan],['whoop','WHOOP',IC.pulse],['progress','Progress',IC.prog],['supps','Supps',IC.supp],['habits','Habits',IC.hab]];
  document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab ${UI.tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[2]}<span>${t[1]}</span></button>`).join('');
}

/* ---------- TRAIN ---------- */
function renderTrain(){
  const d=UI.date,k=tplOf(d),v=document.getElementById('view');
  if(!k){v.innerHTML=`<div class="card" style="margin-top:14px"><h4 class="disp">No session on this date</h4><p class="muted">Your plan runs ${nice(S.start)} to ${nice(S.end)}.</p><button class="cta" style="--c:var(--upper)" data-a="gostart">Go to day one</button></div>`;return}
  const t=T[k],c=KCOLOR(t.k),u=units(d),pct=pctOf(u),est=estimate(d),ph=phaseOf(d),moved=!!S.moves[d];
  let h='';
  // hero
  const segs=[['Mob',est.m,u.mob],['Warm',est.w,u.wu],['Strength',est.s,u.str],['Core',est.c,u.core],['Cardio',est.cd,u.cardio]].filter(s=>s[1]>0.5&&s[2][1]>0);
  h+=`<section class="hero" style="--c:${c}">
    <div class="big-pct disp num">${Math.round(pct*100)}%<small>done</small></div>
    <div class="when">${nice(d)}</div>
    <h2 class="disp">${t.n}</h2>
    <div class="focus">${t.f}</div>
    <div class="tags"><span class="tag">About ${mins(est.total)}</span><span class="tag">Cycle ${ph.c+1}, week ${ph.cw} of 6</span>${t.blocks?`<span class="tag">${ph.name}${ph.deload?'':', RIR '+ph.rir}</span>`:''}${moved?'<span class="tag">Rescheduled</span>':''}${S.done[d]?'<span class="tag">Complete</span>':''}</div>
    <div class="seg">${segs.map(s=>`<div style="flex:${Math.max(s[1],10)}"><span style="width:${s[2][1]?s[2][0]/s[2][1]*100:0}%"></span></div>`).join('')}</div>
    <div class="seglab">${segs.map(s=>`<span style="flex:${Math.max(s[1],10)}">${s[1]>=20?s[0]+' ':''}${Math.round(s[1])}′</span>`).join('')}</div>
    <div class="hero-actions"><button class="hbtn solid" data-a="colall">${SECS.every(isCol)?'Expand all':'Compact view'}</button><button class="hbtn" data-a="move">Move or copy</button>${(S.hist||[]).length?'<button class="hbtn" data-a="undosched" title="'+esc(S.hist[S.hist.length-1].label)+'">↶ Undo</button>':''}</div>
  </section>`;
  if(t.blocks){
    const r=readyOf(d);h+=whoopCard(d);
    h+=`<div class="ready"><span>${S.whoop.connected&&!S.ready[d]&&whoopDay(d)&&S.whoop.auto?'From WHOOP':'Recovery'}</span>
      <button class="rbtn ${r==='g'?'on':''}" data-a="ready" data-v="g">Green<small>full session</small></button>
      <button class="rbtn ${r==='y'?'on':''}" data-a="ready" data-v="y">Yellow<small>lighter day</small></button>
      <button class="rbtn ${r==='r'?'on':''}" data-a="ready" data-v="r">Red<small>recovery only</small></button></div>`;
    if(r==='y')h+=`<div class="note"><b>Lighter day.</b> One set fewer on accessories and arms, main lifts stop at 2 reps in reserve, cardio stays Zone 2.</div>`;
    if(r==='r')h+=`<div class="note" style="--c:var(--bad)"><b>Recovery day.</b> Lifting is off today. Do the mobility, core and an easy 30-minute Zone 2. Come back tomorrow fresh.</div>`;
    if(ph.deload)h+=`<div class="note"><b>Deload week.</b> Two sets per exercise, loads about 15% lighter, leave 4 reps in the tank. This is where the gains lock in. A new cycle starts next week.</div>`;
    else h+=`<div class="note"><b>This week: ${ph.focus}.</b> ${[(ph.c>0?'The app suggests starting weights from your strength last cycle. ':'')+'Pick loads that leave '+ph.rir+' reps in reserve. They become your starting point for the cycle.','Keep last week’s weights and add one rep to every set.','Same weights again, one more rep. You should be near the top now.','Add weight (the app suggests how much). Reps drop back down.','Same weight as last week, push for one more rep. The hardest week of the cycle.'][ph.pos]}${ph.pos===0&&ph.c>0?(ph.c%2===1?' <b>New cycle:</b> lower reps, heavier loads, and accessories and arm moves rotate to new variations.':' <b>New cycle:</b> lower reps, heavier loads, and the original accessory moves return.'):''}</div>`;
  }
  if(t.k==='rest')h+=`<div class="note"><b>Rest day.</b> The 10-minute flow below is optional but great for the pelvic tilt and low back. Supplements still count today.</div>`;
  if(t.k==='travel')h+=`<div class="note"><b>Travel session, no equipment.</b> All you need is a sturdy chair, a door frame and a towel.${tripAt(d)&&!S.moves[d]?' Swapped in automatically because this day is inside a trip.':''}</div>`;
  if(t.k==='long')h+=`<div class="note"><b>Active recovery.</b> Keep it conversational the whole way. Nose-breathing pace is perfect.</div>`;
  // mobility
  const mob=mobFor(d);
  h+=secHead('M','Mobility',COLORS.mob,u.mob,mins(est.m),t.k==='rest'?'Optional':'','mob');
  h+=isCol('mob')?csum(mob.map((m,i)=>({l:'M'+(i+1),n:E[m.ex].n,a:isChk(d,m.slot)?1:0,b:1})),COLORS.mob,'mob'):`<div class="mlist" style="--c:${COLORS.mob}">${mob.map(m=>mobRow(d,m,COLORS.mob)).join('')}</div>`;
  // warm-up
  const wu=warmFor(d);
  if(wu.length){
    h+=secHead('W','Warm-up',COLORS.warm,u.wu,mins(est.w),'','wu');
    h+=isCol('wu')?csum(wu.map((m,i)=>({l:'W'+(i+1),n:E[m.ex].n,a:isChk(d,m.slot)?1:0,b:1})),COLORS.warm,'wu'):`<div class="mlist" style="--c:${COLORS.warm}">${wu.map(m=>mobRow(d,m,COLORS.warm)).join('')}</div>`;
  }
  // strength
  const blocks=blocksFor(d);
  if(blocks.length){
    h+=secHead('S','Strength',c,u.str,mins(est.s),'','str');
    h+=isCol('str')?csum(blocks.flatMap(b=>b.items.map((it,i)=>({l:b.label+(b.items.length>1?i+1:''),n:E[it.ex].n,a:setsDone(d,it),b:it.rx.sets}))),c,'str'):blocks.map(b=>blockHTML(d,b,c)).join('');
  }
  // core
  const core=coreFor(d);
  if(core.length){
    h+=secHead('C','Core',COLORS.core,u.core,mins(est.c),'','core');
    if(isCol('core'))h+=csum(core.map((it,i)=>({l:'C'+(i+1),n:E[it.ex].n,a:setsDone(d,it),b:it.rx.sets})),COLORS.core,'core');else h+=`<div class="block ss" style="--c:${COLORS.core}"><div class="sslab"><span>Superset, back to back</span><span>Rest ${core[0].rx.rest} s</span></div>${core.map((it,i)=>exCard(d,it,{label:'C'+(i+1),block:{items:core,key:'core'},c:COLORS.core,idx:i})).join('')}</div>`;
  }
  // cardio
  const cd=cardioFor(d);
  if(cd){
    h+=secHead(cd.long?'L':'Z',cd.long?'Long cardio':'Cardio',cd.long?COLORS.long:COLORS.cardio,u.cardio,mins(cd.mins),'','cardio');
    h+=isCol('cardio')?csum([{l:'Z',n:cd.mins+' min, '+cd.m,a:isChk(d,'cardio')?1:0,b:1}],cd.long?COLORS.long:COLORS.cardio,'cardio'):cardioHTML(d,cd);
  }
  if(t.k!=='rest')h+=`<div class="finish"><button class="cta" style="--c:${S.done[d]?'var(--ok)':c}" data-a="finish">${S.done[d]?IC.check+' Session complete':'Finish session'}</button></div>`;
  v.innerHTML=h;
}
const SECS=['mob','wu','str','core','cardio'];
const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const isCol=k=>!!(S.col&&S.col[k]);
function secHead(letter,name,c,u,time,extra,key){return`<div class="sec ${isCol(key)?'closed':''}"><button class="sechead" style="--c:${c}" data-a="col" data-v="${key}" aria-expanded="${!isCol(key)}"><span class="sq">${letter}</span><h3 class="disp">${name}</h3><span class="cnt num">${u[0]}/${u[1]}${extra?' · '+extra:''}<br>${time}</span><span class="chev">${CHEV}</span></button></div>`}

function blockHTML(d,b,c){

function exCard(d,it,o){
  const e=E[it.ex],n=it.rx.sets,log=(S.logs[d]&&S.logs[d][it.slot]&&S.logs[d][it.slot].ex===it.ex)?S.logs[d][it.slot]:{sets:[]};
  const doneN=log.sets.slice(0,n).filter(s=>s.d).length,complete=doneN>=n;
  const sug=e.bw||e.t?null:suggest(it,d);
  const isCore=it.role==='coreR'||it.role==='coreT';
  let rxline=`${n} × ${repTxt(it)}`+(isCore?'':` · RIR ${it.rx.rir}`)+(o.block.items.length===1?` · rest ${it.rx.rest} s`:'');
  const shut=UI.exc[it.slot]===true||(complete&&UI.exo[it.slot]!==true)||(UI.compact&&UI.exo[it.slot]!==true);
  let hh=`<article class="ex ${complete?'complete':''} ${shut?'shut':''}" style="--c:${o.c}">
   <div class="exh" data-a="excol" data-k="${it.slot}" data-s="${shut?1:0}" role="button" aria-expanded="${!shut}"><span class="lab">${complete?IC.check.replace('<svg','<svg width="20" height="20"'):o.label}</span><div class="ext"><b>${esc(e.n)}</b><div class="rx num">${rxline}</div>${shut?`<span class="prog-chip">${doneN}/${n} sets${complete?' done':''}</span>`:''}</div><span class="chev">${CHEV}</span></div>`;
  if(shut)return hh+'</article>';

  if(it.ex!==it.base){const scope=S.swaps[d]&&S.swaps[d][it.slot]?'today':'in every session';hh+=`<div class="swapped"><span>Replaces ${esc(E[it.base].n)} ${scope}</span><button data-a="undoswap" data-k="${it.slot}" data-b="${it.base}">Undo</button></div>`}
  if(sug)hh+=`<div class="sugg num">Last (${short(sug.lp.d)}): ${sug.lp.sets.map(s=>s.w+'×'+s.r).join(', ')}. Try <b>${sug.w} kg</b>. <span class="muted">${sug.why}.</span></div>`;
  else if(!e.bw&&!e.t&&!isCore)hh+=`<div class="sugg">First time: pick a load you could lift ${Number(String(it.rx.rir)[0])+0||2} more reps with. The app suggests next time.</div>`;

    else if(e.bw){hh+=`<div class="set bw ${s.d?'done':''}"><span class="sn">${i+1}</span><label class="fld"><input inputmode="numeric" data-in="r" data-k="${k}" value="${esc(s.r)}" placeholder="${rangeOf(it.rx.reps)[1]}"><em>reps</em></label><button class="tick ${s.d?'on':''}" data-a="set" data-k="${k}" aria-label="Set ${i+1} done">${IC.check}</button></div>`}
    else{hh+=`<div class="set ${s.d?'done':''}"><span class="sn">${i+1}</span><label class="fld"><input inputmode="decimal" data-in="w" data-k="${k}" value="${esc(s.w)}" placeholder="${sug?sug.w:'–'}"><em>kg</em></label><label class="fld"><input inputmode="numeric" data-in="r" data-k="${k}" value="${esc(s.r)}" placeholder="${rangeOf(it.rx.reps)[1]}"><em>reps</em></label><button class="tick ${s.d?'on':''}" data-a="set" data-k="${k}" aria-label="Set ${i+1} done">${IC.check}</button></div>`}
  }
  hh+=`</div><div class="tools"><button class="mini demo" data-a="demo" data-e="${it.ex}">${IC.play} Demo</button><button class="mini" data-a="swap" data-k="${it.slot}" data-b="${it.base}">${IC.swap} Replace</button><button class="mini" data-a="exinfo" data-k="${it.slot}">${IC.info} Form</button></div>
  <div class="info hide" id="info-${it.slot}">${esc(cueOf(e))}${sideNote(e,1)}${e.p?`<div><span class="chipinj" style="--c:${o.c}">Protects: ${esc(protOf(e))}</span></div>`:''}</div>
  </article>`;
  return hh;
}

   h+=`</div>`}
  h+=`<div class="card">${cardHead('psched','Weekly schedule')}`;if(!isCol('psched')){h+=`<p class="muted" style="font-size:13.5px;margin:0 0 6px">Change which day each session falls on. It applies to every week; single-day moves are made from the Train tab.</p>`;

function hm(h){if(h==null||isNaN(h))return'–';const m=Math.round(h*60);return Math.floor(m/60)+'h '+pad(m%60)+'m'}
function fmtM(key,v){const M=MET[key];if(v==null||isNaN(v))return'–';if(M.f)return M.f(v);return(+v).toFixed(M.dec||0)+(M.u?' '+M.u:'')}

function insights(){

  const good=[],short=[];days.forEach(d=>{const x=W(d);if(x&&x.sleep&&x.sleep.dur!=null&&x.rec!=null)(x.sleep.dur>=7.5?good:short).push(x.rec)});

  const byW=[[],[],[],[],[],[],[]];days.forEach(d=>{const v=mval('rec',d);if(v!=null)byW[dow(d)].push(v)});const wa=byW.map(a=>a.length>=2?avg(a):null);
  if(wa.filter(x=>x!=null).length>=5){const ok=wa.filter(x=>x!=null);const best=wa.indexOf(Math.max(...ok)),worst=wa.indexOf(Math.min(...ok));out.push({e:'📅',c:WC.strain,k:'rec',t:`${DN[best]}s are your best recovery days`,s:`${DN[best]} averages ${Math.round(wa[best])}%, ${DN[worst]} only ${Math.round(wa[worst])}%. Plan your heaviest sessions accordingly.`})}
  const up=[],lo=[];days.forEach(d=>{const k=tplOf(d);if(!k||!S.done[d])return;const v=mval('rec',addD(d,1));if(v==null)return;if(T[k].k==='upper')up.push(v);if(T[k].k==='lower')lo.push(v)});

  if(hs.length>=3&&ls.length>=3)out.push({e:'⚡',c:WC.strain,k:'strain',t:`High-strain days drop next-day recovery ${Math.max(0,Math.round(avg(ls)-avg(hs)))}%`,s:`After strain 14+ you recover to ${Math.round(avg(hs))}% on average, vs ${Math.round(avg(ls))}% after lighter days.`});
  const st=[],sl=[];days.forEach(d=>{const x=W(d),n=mval('rec',addD(d,1));if(!x||x.steps==null||n==null)return;(x.steps>=(S.stepGoal||8000)?st:sl).push(n)});
  if(st.length>=3&&sl.length>=3){const df=Math.round(avg(st)-avg(sl));out.push({e:'👟',c:WC.steps,k:'steps',t:`Hitting your step goal: ${df>=0?'+':''}${df}% next-day recovery`,s:`Next-day recovery averages ${Math.round(avg(st))}% after ${(S.stepGoal||8000).toLocaleString()}+ steps vs ${Math.round(avg(sl))}% on quieter days.`})}

/* ---------- PROGRESS ---------- */
function planDays(){const a=[];for(let d=S.start;d<=S.end;d=addD(d,1))a.push(d);return a}
function analyze(){
  const t=todayS();const days=planDays().filter(d=>isTraining(tplOf(d)));
  const past=days.filter(d=>d<t||S.done[d]);const done=past.filter(d=>S.done[d]);
  const strPast=past.filter(d=>T[tplOf(d)].k!=='long');const strDone=strPast.filter(d=>S.done[d]);
  const adh=strPast.length?strDone.length/strPast.length:null;
  const h=hist();let up=0,tracked=0;
  Object.keys(h).forEach(ex=>{const a=h[ex];if(a.length<2)return;tracked++;const f=Math.max(...a[0].sets.map(s=>e1rm(+s.w,+s.r))),l=Math.max(...a[a.length-1].sets.map(s=>e1rm(+s.w,+s.r)));if(l>f*1.01)up++});
  const prog=tracked?up/tracked:null;
  const reds=planDays().filter(d=>d<=todayS()&&readyOf(d)==='r').length;
  let rec;
  if(adh===null||strPast.length<6)rec={vol:0,extra:false,trim:false,title:'Keep the same structure',why:'There isn\u2019t enough logged training yet to adjust. The extension continues the block cycle, and the weight suggestions keep progressing from your logs.'};
  else if(adh>=0.85&&(prog===null||prog>=0.5)&&reds<4)rec={vol:1,extra:true,trim:false,title:'Level up: more volume',why:`You completed ${Math.round(adh*100)}% of sessions and ${prog===null?'your':Math.round(prog*100)+'% of'} tracked lifts are trending up. The extension rotates in a fresh accessory superset, adds an arm set, and tightens accessory rest to 45 s, so you do more work in the same 75–90 minutes.`};
  else if(adh>=0.6)rec={vol:0,extra:false,trim:false,title:'Hold volume, keep adding load',why:`Attendance is solid at ${Math.round(adh*100)}%. Volume stays the same so recovery keeps pace; loads keep climbing through the suggestions.`};
  else rec={vol:-1,extra:false,trim:true,title:'Trim to the essentials',why:`Only ${Math.round(adh*100)}% of sessions got done, so the extension removes the optional accessory superset and one accessory set. Shorter sessions are easier to show up for.`};
  return{days,past,done,adh,prog,tracked,reds,rec};
}

function whoopTrend(){
  if(!S.whoop.connected)return'';const t=todayS(),days=[];for(let i=29;i>=0;i--){const d=addD(t,-i);days.push([d,S.wdata[d]])}
  const have=days.filter(x=>x[1]&&x[1].rec!=null);if(!have.length)return`<div class="card"><h4 class="disp">WHOOP trends</h4><p class="muted" style="margin:0;font-size:14px">Your recovery, HRV and resting HR will chart here after the first sync.</p></div>`;
  const W=300,H=110,bw=W/30;let bars='',hp='',rp='';const hv=have.map(x=>x[1].hrv).filter(v=>v!=null),rv=have.map(x=>x[1].rhr).filter(v=>v!=null);
  const hmin=Math.min(...hv),hmax=Math.max(...hv),rmin=Math.min(...rv),rmax=Math.max(...rv);
  days.forEach(([d,x],i)=>{if(!x||x.rec==null)return;const hh=x.rec/100*H;const c=x.rec>=67?'#12B76A':x.rec>=34?'#F59E0B':'#EF3B55';bars+=`<rect x="${(i*bw+1).toFixed(1)}" y="${(H-hh).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="${c}" opacity=".55"/>`;
    const cx=(i*bw+bw/2).toFixed(1);if(x.hrv!=null)hp+=`${cx},${(H-8-(x.hrv-hmin)/((hmax-hmin)||1)*(H-24)).toFixed(1)} `;if(x.rhr!=null)rp+=`${cx},${(H-8-(x.rhr-rmin)/((rmax-rmin)||1)*(H-24)).toFixed(1)} `});
  const avg=a=>a.length?Math.round(a.reduce((p,q)=>p+q,0)/a.length):'–';
  return`<div class="card"><h4 class="disp">WHOOP trends</h4><div class="muted" style="font-size:12.5px;margin-bottom:6px">Last 30 days. Bars: recovery. Lines: <b style="color:#2F5BFF">HRV</b> and <b style="color:#FF2D78">resting HR</b>.</div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${bars}<polyline points="${hp}" fill="none" stroke="#2F5BFF" stroke-width="2.5" stroke-linejoin="round"/><polyline points="${rp}" fill="none" stroke="#FF2D78" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="4 3"/></svg>
  <div class="grid2" style="grid-template-columns:repeat(3,1fr);margin-top:10px"><div class="stat"><b class="disp num">${avg(have.map(x=>x[1].rec))}%</b><span>Avg recovery</span></div><div class="stat"><b class="disp num">${avg(hv)}</b><span>Avg HRV ms</span></div><div class="stat"><b class="disp num">${avg(rv)}</b><span>Avg RHR</span></div></div></div>`;
}
function weekStreak(){const t=todayS();let w=sunOf(t),n=0;const cnt=s=>{let c=0;for(let i=0;i<7;i++)if(S.done[addD(s,i)])c++;return c};if(cnt(w)<4)w=addD(w,-7);while(w>=sunOf(S.start)&&cnt(w)>=4){n++;w=addD(w,-7)}return n}
function ring(p,c,size,sw,label){const r=(size-sw)/2,C=2*Math.PI*r;return`<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--sf2)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,p))}" transform="rotate(-90 ${size/2} ${size/2})"/>${label?`<text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-size="${size/4.6}" font-weight="850" fill="var(--ink)" style="font-stretch:68%">${label}</text>`:''}</svg>`}
function spark(pts){const W=110,H=34;if(pts.length<2)return`<span class="pill" style="--c:${COLORS.upper}">${Math.round(pts[0])} e1RM</span>`;const mn=Math.min(...pts),mx=Math.max(...pts),rg=mx-mn||1;const p=pts.map((v,i)=>`${(i/(pts.length-1)*(W-6)+3).toFixed(1)},${(H-3-(v-mn)/rg*(H-6)).toFixed(1)}`).join(' ');const up=pts[pts.length-1]>=pts[0];return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${p}" fill="none" stroke="${up?'#12B76A':'#EF3B55'}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`}

const LINKS={
  sleep:{l:'Sleep duration',u:'hours',op:'≥',def:7,short:'sleep'},
  sleepPerf:{l:'Sleep performance',u:'%',op:'≥',def:85,short:'sleep score'},
  rec:{l:'Recovery',u:'%',op:'≥',def:67,short:'recovery'},
  hrv:{l:'HRV',u:'ms',op:'≥',def:60,short:'HRV'},
  rhr:{l:'Resting heart rate',u:'bpm',op:'≤',def:60,short:'resting HR'},
  steps:{l:'Steps',u:'steps',op:'≥',def:8000,short:'steps'},
  strain:{l:'Strain',u:'',op:'≥',def:10,short:'strain'},
  kcal:{l:'Calories burned',u:'kcal',op:'≥',def:2500,short:'calories'}
};
function realVal(key,d){const x=(S.wdata||{})[d];if(!x||!MET[key])return null;try{const v=MET[key].g(x);return v==null||isNaN(v)?null:+v}catch(e){return null}}
function habById(id){return S.habits.find(h=>h.id===id)}
function habAuto(h,d){if(!h||!h.link||!LINKS[h.link.k])return null;const v=realVal(h.link.k,d);if(v==null)return null;return LINKS[h.link.k].op==='≤'?v<=h.link.t:v>=h.link.t}
function habDone(id,d){const h=habById(id);if(h&&h.link){const ov=S.habOv&&S.habOv[id]&&S.habOv[id][d];if(ov!=null)return ov===1;const a=habAuto(h,d);if(a!==null)return a}return!!(S.habitLog[id]&&S.habitLog[id][d])}
function habToggle(id,d){const h=habById(id);if(!h)return;const cur=habDone(id,d);
  if(h.link){const a=habAuto(h,d);if(a!==null){S.habOv[id]=S.habOv[id]||{};if(!cur===a)delete S.habOv[id][d];else S.habOv[id][d]=cur?0:1;return}}
  S.habitLog[id]=S.habitLog[id]||{};if(S.habitLog[id][d])delete S.habitLog[id][d];else S.habitLog[id][d]=1}
function habStreak(id){let t=todayS(),n=0;if(!habDone(id,t))t=addD(t,-1);while(habDone(id,t)&&n<1000){n++;t=addD(t,-1)}return n}
function habBest(id){let best=0,cur=0;const t=todayS();for(let i=400;i>=0;i--){if(habDone(id,addD(t,-i))){cur++;best=Math.max(best,cur)}else cur=0}return best}
function linkText(h){const L=LINKS[h.link.k];return`${L.l} ${L.op} ${h.link.k==='sleep'?hm(h.link.t):h.link.t.toLocaleString()+(L.u&&L.u!=='steps'?' '+L.u:'')}`}
function guessLink(name){let m=name.match(/sleep[^\d]*(\d+(?:[.,]\d+)?)\s*(?:h|hr|hrs|hour|hours)\b/i)||name.match(/(\d+(?:[.,]\d+)?)\s*\+?\s*(?:h|hr|hrs|hours?)\b[^\d]*sleep/i);
  if(m){const t=parseFloat(m[1].replace(',','.'));if(t>=3&&t<=12)return{k:'sleep',t}}
  m=name.match(/(\d[\d,.]*)\s*\+?\s*steps?\b/i)||name.match(/steps?[^\d]*(\d[\d,.]*)/i);
  if(m){const t=parseInt(m[1].replace(/[,.]/g,''),10);if(t>=1000&&t<=60000)return{k:'steps',t}}
  return null}

function beep(f,len,n){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<(n||1);i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f||880;o.connect(g);g.connect(AC.destination);const t0=AC.currentTime+i*0.22;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.35,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+(len||0.18));o.start(t0);o.stop(t0+(len||0.18)+0.02)}}catch(e){}try{navigator.vibrate&&navigator.vibrate(n>1?[120,80,120]:80)}catch(e){}}

setInterval(()=>{if(!TM||TM.paused)return;const rem=(TM.end-Date.now())/1000;

  case'wauto':S.whoop.auto=!S.whoop.auto;save();rerender();settingsSheet();break;
  case'mob':{const on=!isChk(d,k);setChk(d,k,on);markStart(d);save();delete UI.exo[k];if(!checkComplete(d))rerender();break}
  case'mtimer':{const m=mobFor(d).concat(warmFor(d)).find(x=>x.slot===k);const e=E[m.ex];const mc=m.kind==='wu'?COLORS.warm:COLORS.mob;const ph=e.u?[{l:'Left side',s:m.dose,c:mc},{l:'Right side',s:m.dose,c:mc}]:[{l:e.n,s:m.dose,c:mc}];startTimer(e.n,ph,()=>{setChk(d,k,1);save();if(!checkComplete(d))rerender()});break}
  case'set':toggleSet(d,k);break;
  case'tset':{const[slot,i]=k.split('|');const f=findItem(d,slot);const e=E[f.it.ex],sec=secsOf(f.it);const col=slot[0]==='c'?COLORS.core:COLORS.upper;const ph=e.u?[{l:'Left side',s:sec,c:col},{l:'Right side',s:sec,c:col}]:[{l:'Hold',s:sec,c:col}];startTimer(e.n+', set '+(+i+1),ph,()=>{const o=slotLog(d,slot,f.it.ex,f.it.rx.sets);if(!o.sets[+i].d)toggleSet(d,k,true)});break}
  case'cardiochk':setChk(d,'cardio',!isChk(d,'cardio'));markStart(d);save();if(!checkComplete(d))rerender();break;
  case'cardiotimer':{const cd=cardioFor(d);startTimer(cd.long?'Long cardio':'Cardio',cardioPhases(cd).map(p=>({...p,c:/Hard/.test(p.l)?COLORS.cardio:COLORS.long})),()=>{setChk(d,'cardio',1);save();if(!checkComplete(d))rerender()});break}
  case'finish':if(S.done[d]){delete S.done[d];save();rerender();toast('Marked as not finished')}else{S.done[d]={t:Date.now(),partial:pctOf(units(d))<1};save();rerender();finishSheet(d)}break;
  case'exinfo':{const x=document.getElementById('info-'+k);x&&x.classList.toggle('hide');break}
  case'pinvid':{const cur=S.vids[el.dataset.e]||'';const u=window.prompt('Paste a YouTube link for '+E[el.dataset.e].n+' (leave empty to go back to the search):',cur);if(u===null)break;if(u.trim())S.vids[el.dataset.e]=u.trim();else delete S.vids[el.dataset.e];save();rerender();break}
  case'swap':swapSheet(k,el.dataset.b);break;
  case'demo':openPlayer(el.dataset.e);break;
  case'vidchange':{const ex=el.dataset.e;const u=window.prompt('Paste a YouTube link (Shorts or normal) for '+E[ex].n+':','');if(u===null)break;const id=parseYT(u);if(!id){toast('That doesn\u2019t look like a YouTube link');break}S.vids[ex]=id;save();drawPlayer();toast('Video updated');break}
  case'vidreset':{delete S.vids[el.dataset.e];save();drawPlayer();break}
  case'doswap':{const slot=k,base=el.dataset.b,to=el.dataset.e,scope=el.dataset.s;const prev={day:S.swaps[d]&&S.swaps[d][slot],all:S.swapsAll[base]};
    if(scope==='day'){S.swaps[d]=S.swaps[d]||{};if(to===(S.swapsAll[base]||base))delete S.swaps[d][slot];else S.swaps[d][slot]=to}else{if(S.swaps[d])delete S.swaps[d][slot];if(to===base)delete S.swapsAll[base];else S.swapsAll[base]=to}
    save();closeSheet();rerender();toast('Replaced with '+E[to].n,()=>{S.swaps[d]=S.swaps[d]||{};if(prev.day)S.swaps[d][slot]=prev.day;else delete S.swaps[d][slot];if(prev.all)S.swapsAll[base]=prev.all;else delete S.swapsAll[base]});break}
  case'undoswap':{const slot=k,base=el.dataset.b;if(S.swaps[d]&&S.swaps[d][slot])delete S.swaps[d][slot];else delete S.swapsAll[base];save();rerender();toast('Back to '+E[base].n);break}
  case'toastundo':if(UI.undo){UI.undo();UI.undo=null;save();rerender()}document.getElementById('toast').classList.add('hide');break;
  case'move':UI.mv={mode:'move'};moveSheet();break;
  case'obopen':closeSheet();openOnboarding();break;
  case'obclose':closeOnboarding();break;
  case'obskip':closeOnboarding();UI.fresh=false;save();toast('Using the sample plan. Build your own anytime in Settings.');break;
  case'obrestore':if(window.confirm('Go back to your previous plan? Your logs stay.'))restorePlan();break;
  case'obback':UI.ob.step=Math.max(0,UI.ob.step-1);drawOb();break;
  case'obnext':{const st=OB_STEPS[UI.ob.step];if(st==='schedule'&&UI.ob.a.days.length<2){toast('Pick at least 2 lifting days');break}UI.ob.step=Math.min(OB_STEPS.length-1,UI.ob.step+1);if(OB_STEPS[UI.ob.step]==='stack'&&!UI.fresh&&false)UI.ob.step++;drawOb();break}
  case'obpick':{const f=el.dataset.f,v=el.dataset.v;UI.ob.a[f]=isNaN(+v)?v:+v;drawOb();break}
  case'obtog':{const f=el.dataset.f,v=el.dataset.v;const arr=UI.ob.a[f]=UI.ob.a[f]||[];const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);drawOb();break}
  case'obday':{const v=+el.dataset.v,a2=UI.ob.a;const i=a2.days.indexOf(v);if(i>=0)a2.days.splice(i,1);else{if(a2.days.length>=6){toast('Six lifting days is the maximum');break}a2.days.push(v)}if(a2.days.includes(+a2.longDay))a2.longDay=-1;drawOb();break}
  case'obfinish':obFinish();break;
  case'mvmode':UI.mv={mode:el.dataset.v};moveSheet();break;
  case'dosched':{const mode=(UI.mv&&UI.mv.mode)||'move',tg=el.dataset.d;const last=d;if(doSchedule(mode,tg)){closeSheet();UI.date=mode==='move'?tg:d;rerender();toast((mode==='move'?'Moved to ':'Copied to ')+short(tg),()=>{undoSched()})}break}
  case'undosched':{const e=undoSched();if(e){closeSheet();rerender();toast('Undone: '+e.label)}else toast('Nothing to undo');break}
  case'resetsched':{if(resetSchedule()){rerender();toast('Schedule reset',()=>{undoSched()})}break}
  case'settings':settingsSheet();break;
  case'close':closeSheet();break;
  case'tadj':if(TM){const dv=+el.dataset.v;if(TM.paused)TM.left=Math.max(1,TM.left+dv);else TM.end=Math.max(Date.now()+1000,TM.end+dv*1000);drawTimer()}break;
  case'tpause':if(TM){if(TM.paused){TM.end=Date.now()+TM.left*1000;TM.paused=false}else{TM.left=(TM.end-Date.now())/1000;TM.paused=true}drawTimer()}break;
  case'tstop':TM=null;drawTimer();break;
  case'extend':{const ne=document.getElementById('extEnd').value;if(!ne||ne<=S.end){toast('Pick a date after '+short(S.end));break}const r=analyze().rec;S.ext.push({from:addD(S.end,1),to:ne,vol:r.vol,extra:r.extra,trim:r.trim});S.end=ne;save();rerender();toast('Plan extended to '+short(ne));break}
  case'unextend':{const x=S.ext.pop();if(x){S.end=addD(x.from,-1);save();rerender();toast('Extension removed')}break}
  case'supp':{const dd=UI.sday||todayS();S.suppLog[dd]=S.suppLog[dd]||{};if(S.suppLog[dd][k])delete S.suppLog[dd][k];else S.suppLog[dd][k]=1;if(!Object.keys(S.suppLog[dd]).length)delete S.suppLog[dd];save();rerender();break}
  case'sopen':UI.sx=UI.sx===k?null:k;rerender();break;
  case'sday':{const nd=addD(UI.sday||todayS(),+el.dataset.v);if(nd<=todayS()){UI.sday=nd;rerender()}break}
  case'stoday':UI.sday=todayS();rerender();break;
  case'sdaytoggle':{const dd=el.dataset.d;if(dd>todayS())break;S.suppLog[dd]=S.suppLog[dd]||{};if(S.suppLog[dd][k])delete S.suppLog[dd][k];else S.suppLog[dd][k]=1;if(!Object.keys(S.suppLog[dd]).length)delete S.suppLog[dd];save();rerender();break}
  case'sm':{const cur=UI.sm[k]||todayS().slice(0,7);const[y,m]=cur.split('-').map(Number);const nd=new Date(y,m-1+(+el.dataset.v),1);UI.sm[k]=nd.getFullYear()+'-'+pad(nd.getMonth()+1);rerender();break}
  case'sguide':guideSheet('');break;
  case'gadd':{const e=SUPP_DB.find(x=>x.id===el.dataset.v);if(e)suppSheet(null,e);break}
  case'suppedit':UI.suppEdit=!UI.suppEdit;rerender();break;
  case'suppopen':suppSheet(k);break;
  case'scol':UI.sdraft.c=el.dataset.v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break;
  case'delsupp':{const i=S.supps.findIndex(s=>s.id===k);if(i<0)break;const rem=S.supps.splice(i,1)[0];save();closeSheet();rerender();toast('Removed '+rem.n,()=>S.supps.splice(i,0,rem));break}
  case'addsupp':suppSheet();break;
  case'suppsave':{const n=document.getElementById('sn').value.trim();if(!n){toast('Add a name first');break}const inf=suppInfo(n);const o={n,d:document.getElementById('sd').value.trim()||(inf?inf.d.replace(/ daily$/,''):'1 serving'),slot:document.getElementById('ss').value,note:document.getElementById('snote').value.trim()||'',c:UI.sdraft.c};if(k){Object.assign(S.supps.find(q=>q.id===k),o);toast('Saved '+n)}else{S.supps.push(Object.assign({id:'s'+Date.now()},o));toast(inf?'Added '+n+'. Tap it to see benefits and best time.':'Added '+n)}save();closeSheet();rerender();break}
  case'habtoday':case'habday':{habToggle(k,el.dataset.d||todayS());save();rerender();break}
  case'habopen':UI.hx=UI.hx===k?null:k;rerender();break;
  case'habm':{const cur=UI.hm[k]||todayS().slice(0,7);const[y,m]=cur.split('-').map(Number);const nd=new Date(y,m-1+(+el.dataset.v),1);UI.hm[k]=nd.getFullYear()+'-'+pad(nd.getMonth()+1);rerender();break}
  case'habadd':habSheet(null);break;
  case'habedit':habSheet(k);break;
  case'hemo':UI.hdraft.e=el.dataset.v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break;
  case'hcol':UI.hdraft.c=el.dataset.v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break;
  case'habsave':{const n=document.getElementById('hn').value.trim();if(!n){toast('Give the habit a name');break}
    const lk=document.getElementById('hlk').value;let link=null;if(lk){let tv=parseFloat((document.getElementById('hlt').value||'').replace(',','.'));if(isNaN(tv)||tv<=0)tv=LINKS[lk].def;link={k:lk,t:tv}}
    let hb;if(k){hb=S.habits.find(h=>h.id===k);Object.assign(hb,{n,e:UI.hdraft.e,c:UI.hdraft.c})}else{hb={id:'h'+Date.now(),n,e:UI.hdraft.e,c:UI.hdraft.c};S.habits.push(hb);UI.hx=hb.id}
    if(link){hb.link=link;delete hb.noAuto}else{if(hb.link||k)hb.noAuto=true;delete hb.link}
    let msg='';if(!hb.link&&!hb.noAuto){const g=guessLink(n);if(g){hb.link=g;msg='Linked to WHOOP '+LINKS[g.k].short+' automatically'}}
    save();closeSheet();rerender();if(msg)toast(msg);break}
  case'habdel':{const i=S.habits.findIndex(h=>h.id===k);if(i<0)break;const rem=S.habits.splice(i,1)[0];if(UI.hx===k)UI.hx=null;save();closeSheet();rerender();toast('Deleted '+rem.n,()=>S.habits.splice(i,0,rem));break}
  case'bkcopy':{const tx=document.getElementById('bk');tx.value=JSON.stringify(S);tx.select();try{navigator.clipboard.writeText(tx.value).then(()=>toast('Backup copied'),()=>toast('Select the text and copy it'))}catch(e){toast('Select the text and copy it')}break}
  case'bkrestore':{try{const o=JSON.parse(document.getElementById('bk').value);if(!o||!o.start)throw 0;S=Object.assign(defaults(),o);save();closeSheet();rerender();toast('Backup restored')}catch(e){toast('That text isn\u2019t a valid backup')}break}
  case'reset':if(window.confirm('Delete all logs, habits and settings? This cannot be undone.')){S=defaults();save();closeSheet();UI.date=S.start;rerender()}break;
  }
});
document.addEventListener('input',ev=>{const el=ev.target;if(!el.dataset)return;
  if(el.dataset.in==='ob'&&UI.ob){UI.ob.a[el.dataset.f]=el.value}
  if(el.dataset.in==='sname')suppNameInput(el);
  if(el.dataset.in==='gq'){const q=el.value,pos=el.selectionStart;guideSheet(q);const n=document.getElementById('gq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
});
document.addEventListener('change',ev=>{
  const el=ev.target;if(!el.dataset||!el.dataset.in)return;const t=el.dataset.in,k=el.dataset.k,d=UI.date;
  if(t==='w'||t==='r'){const[slot,i]=k.split('|');const f=findItem(d,slot);if(!f)return;const o=slotLog(d,slot,f.it.ex,f.it.rx.sets);o.sets[+i][t]=el.value.replace(',','.').trim();save();HISTCACHE=null}
  else if(t==='map'){if(S.map[k]!==el.value){snapSched(`${DN[k]}s changed from ${T[S.map[k]].n} to ${T[el.value].n}`,[],[],true);S.map[k]=el.value;save();rerender();toast(DN[k]+' is now '+T[el.value].n,()=>{undoSched()})}}
  else if(t==='mvdate'){if(el.value){const mode=(UI.mv&&UI.mv.mode)||'move';if(doSchedule(mode,el.value)){closeSheet();UI.date=mode==='move'?el.value:UI.date;rerender();toast((mode==='move'?'Moved to ':'Copied to ')+short(el.value),()=>{undoSched()})}}}
  else if(t==='start'){if(el.value&&el.value<S.end){S.start=el.value;save();rerender();toast('Plan now starts '+short(el.value))}}
  else if(t==='hlk'){const v2=el.value;document.getElementById('hlrow').classList.toggle('hide',!v2);if(v2){const L=LINKS[v2];document.getElementById('hllab').textContent='Done when '+L.l.toLowerCase()+' '+L.op+(L.u?' ('+L.u+')':'');document.getElementById('hlt').value=L.def}}
  else if(t==='sday'){if(el.value&&el.value<=todayS()){UI.sday=el.value;rerender()}}
  else if(t==='ob'&&UI.ob){UI.ob.a[el.dataset.f]=el.value;if(el.tagName==='SELECT')drawOb()}
  else if(t==='theme'){applyTheme(el.value);try{localStorage.setItem(KEY+'-theme',el.value)}catch(e){}}
});
function applyTheme(v){if(v==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v)}
try{applyTheme(localStorage.getItem(KEY+'-theme')||'auto')}catch(e){}
(function(){const q=new URLSearchParams(location.search);const w=q.get('whoop');if(w){history.replaceState(null,'',location.pathname);if(w==='connected'){S.whoop.last=0;save();if(!S.whoop.key)setTimeout(()=>toast('WHOOP connected. Go back to the IRON app on your home screen.'),300)}else setTimeout(()=>toast('WHOOP connection failed ('+(q.get('reason')||'unknown')+')'),300)}})();
applyProfile();UI.fresh=FRESH;
autoLinkHabits();
rerender();
if(FRESH)setTimeout(openOnboarding,250);
if(WH_ON&&(S.whoop.connected||S.whoop.pending))whoopSync(false);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&WH_ON&&(S.whoop.connected||S.whoop.pending))whoopSync(false)});
window.__S=()=>S;window.__est=estimate;window.__UI=UI;
})();
</script>
