<style>
:root{
  --bg:#F3F5FF;--sf:#FFFFFF;--sf2:#EBEEFF;--ink:#191A4A;--mu:#5E6390;--ln:#DCE1F7;
  --upper:#2F5BFF;--lower:#FF6A13;--mob:#00B39A;--core:#E8A900;--cardio:#FF2D78;--long:#7B4DFF;--rest:#8E97BF;--travel:#00A3FF;--warm:#43A512;
  --ok:#12B76A;--warn:#F59E0B;--bad:#EF3B55;
  --shadow:0 1px 0 rgba(25,26,74,.04),0 6px 18px rgba(47,91,255,.07);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F2E;--sf:#181A45;--sf2:#23265C;--ink:#EEF0FF;--mu:#A5AAD8;--ln:#2D3170;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0F2E;--sf:#181A45;--sf2:#23265C;--ink:#EEF0FF;--mu:#A5AAD8;--ln:#2D3170;--shadow:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--upper);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 170px}
.disp{font-stretch:68%;font-weight:850;letter-spacing:-.01em;line-height:.95}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mu)}
.hide{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topin{max-width:760px;margin:0 auto;padding:10px 14px 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{margin:0;font-size:26px}
.brand h1 img.wm{width:auto!important;height:26px!important;border-radius:0!important;box-shadow:none!important;border:0!important;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wm{filter:invert(1) brightness(1.2)}}
:root[data-theme="dark"] .wm{filter:invert(1) brightness(1.2)}
.brand h1.brandlogo{min-height:42px;display:flex;align-items:center;gap:10px;letter-spacing:.06em}.brand h1 img{width:38px;height:38px;border-radius:10px;box-shadow:0 1px 6px rgba(25,26,74,.18);border:1px solid var(--ln)}
.brand h1 i{font-style:normal;display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--lower);margin-right:4px;box-shadow:14px 0 0 var(--upper),28px 0 0 var(--cardio);margin-right:36px;vertical-align:2px}
.icbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center}
.icbtn svg{width:20px;height:20px}
.strip{display:flex;align-items:center;gap:6px;margin-top:10px}
.strip .arrow{flex:0 0 34px;height:58px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-size:18px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dchip{height:58px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;position:relative}
.dchip small{font-size:11px;color:var(--mu);font-weight:600}
.dchip b{font-size:17px;font-weight:800}
.dchip .bar{width:18px;height:4px;border-radius:2px;background:var(--c,transparent)}
.dchip.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dchip.sel small{color:inherit;opacity:.75}
.dchip.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--cardio)}
.dchip.done .bar{height:6px;width:24px}
.dchip.off{opacity:.4}
.weeklab{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--mu);font-weight:600}
.linkbtn{border:0;background:none;color:var(--upper);font-weight:700;padding:4px 0}

/* hero */
.hero{--c:var(--upper);background:var(--c);color:#fff;border-radius:26px;padding:18px 18px 16px;margin:10px 0 14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .when{font-size:14px;font-weight:600;opacity:.92;position:relative}
.hero h2{font-size:clamp(50px,15vw,76px);margin:6px 0 2px;position:relative}
.hero .focus{font-size:18px;font-weight:700;position:relative}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative}
.tag{font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.2)}
.seg{display:flex;gap:4px;margin-top:16px;position:relative}
.seg>div{height:12px;border-radius:6px;background:rgba(255,255,255,.28);overflow:hidden;min-width:14px}
.seg>div>span{display:block;height:100%;background:#fff;border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.seglab{display:flex;gap:4px;margin-top:6px;font-size:12px;font-weight:700;position:relative}
.seglab>span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:14px;opacity:.92}
.hero-actions{display:flex;gap:8px;margin-top:14px;position:relative;flex-wrap:wrap}
.sechead{width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.chev{flex:0 0 30px;height:30px;border-radius:9px;background:var(--sf2);display:grid;place-items:center;transition:transform .2s}
.chev svg{width:16px;height:16px}
.closed .chev{transform:rotate(-90deg)}
.csum{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:4px 12px;margin-bottom:10px}
.crow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--ln);font-size:14px;font-weight:650}
.crow:first-child{border-top:0}
.crow .l2{font-size:11.5px;font-weight:850;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:7px;text-align:center;padding:3px 0}
.crow b{font-size:12.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.crow.full b{color:var(--ok)}
.crow.full span:nth-child(2){text-decoration:line-through;text-decoration-color:var(--ok);opacity:.7}
.exh{cursor:pointer}
.exh .chev{margin-left:auto}
.ex.shut .exh .chev{transform:rotate(-90deg)}
.prog-chip{display:inline-block;margin-top:4px;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--sf2);color:var(--mu)}
.ex.complete .prog-chip{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.chead h4,.chead h5{margin:0!important}
.chead+*{margin-top:10px}
.tvcard{border-radius:24px;overflow:hidden;margin-bottom:12px;background:var(--sf);border:1px solid var(--ln);box-shadow:var(--shadow)}
.tvtop{background:var(--travel);color:#fff;padding:14px 16px;position:relative;overflow:hidden}
.tvtop::after{content:"";position:absolute;right:-30px;bottom:-50px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14)}
.tvtop h3{margin:2px 0 0;font-size:44px}
.tvtop .focus{font-weight:700;font-size:15px}
.tvtop .tags{margin-top:8px}
.tvbody{padding:10px 14px 14px}
.tvbody .grp{font-size:13px;font-weight:800;color:var(--mu);margin:10px 0 2px}
.trip{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.trip div{flex:1}
.trip span{display:block;font-size:12.5px;color:var(--mu)}
.fl{font-size:12.5px;font-weight:750;color:var(--mu)}
.fl{display:block}.grid2>*{min-width:0}input[type=date]{min-width:0;max-width:100%;display:block;-webkit-appearance:none;appearance:none}
.hbtn{border:0;border-radius:12px;padding:9px 13px;font-weight:750;font-size:14px;background:rgba(255,255,255,.22);color:#fff}
.hbtn.solid{background:#fff;color:var(--c)}
.big-pct{position:absolute;right:18px;top:16px;font-size:34px;text-align:right}
.big-pct small{display:block;font-size:12px;font-stretch:100%;font-weight:700;opacity:.85}

/* readiness */
.ready{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px;align-items:center;margin:0 0 14px}
.ready>span{font-size:13px;font-weight:700;color:var(--mu);padding-right:4px}
.rbtn{min-height:52px;border:1.5px solid var(--ln);background:var(--sf);border-radius:12px;padding:8px 4px;font-size:13px;font-weight:750;line-height:1.15}
.rbtn small{display:block;font-weight:600;font-size:11px;color:var(--mu)}
.rbtn[data-v="g"].on{background:var(--ok);border-color:var(--ok);color:#fff}
.rbtn[data-v="y"].on{background:var(--warn);border-color:var(--warn);color:#fff}
.rbtn[data-v="r"].on{background:var(--bad);border-color:var(--bad);color:#fff}
.rbtn.on small{color:#fff;opacity:.9}

/* sections */
.sec{margin:18px 0 8px}
.sechead{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.sechead .sq{width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px}
.sechead h3{margin:0;font-size:26px;flex:1}
.sechead .cnt{font-size:13px;font-weight:750;color:var(--mu);text-align:right;line-height:1.2}
.note{background:var(--sf2);border-radius:14px;padding:10px 12px;font-size:14px;margin:0 0 10px}
.note b{font-weight:800}

/* mobility rows */
.mlist{background:var(--sf);border-radius:20px;border:1px solid var(--ln);overflow:hidden;box-shadow:var(--shadow)}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--ln)}
.mrow:first-child{border-top:0}
.mrow.done .mi b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--mob);opacity:.6}
.mi{flex:1;min-width:0}
.mi b{display:block;font-weight:750;font-size:15px}
.mi span{font-size:13px;color:var(--mu)}
.mi details summary{list-style:none;cursor:pointer}
.mi details summary::-webkit-details-marker{display:none}
.mi .cue{font-size:13px;margin-top:4px;color:var(--ink)}
.chipinj{display:inline-block;font-size:11px;font-weight:750;padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--mob)) 15%,transparent);color:var(--c,var(--mob));margin:3px 4px 0 0}
.tick{flex:0 0 40px;width:40px;height:40px;border-radius:12px;border:2px solid var(--ln);background:var(--sf);display:grid;place-items:center;padding:0}
.tick svg{width:20px;height:20px;opacity:0}
.tick.on{background:var(--c,var(--ok));border-color:var(--c,var(--ok));color:#fff}
.tick.on svg{opacity:1}
.mini{border:1px solid var(--ln);background:var(--sf2);border-radius:10px;height:36px;min-width:36px;padding:0 9px;font-size:13px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;white-space:nowrap}
.mini svg{width:16px;height:16px}
.mini.play{background:var(--c,var(--mob));border-color:transparent;color:#fff}
.mini.yt{color:#E11D48}

/* exercise cards */
.block{margin:0 0 12px;position:relative}
.block.ss{background:color-mix(in srgb,var(--c) 9%,var(--bg));border-radius:24px;padding:10px;border:1.5px dashed color-mix(in srgb,var(--c) 45%,transparent)}
.sslab{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;color:var(--c);padding:2px 6px 8px}
.ex{background:var(--sf);border-radius:20px;border:1px solid var(--ln);padding:12px;box-shadow:var(--shadow)}
.block.ss .ex+.ex{margin-top:8px}
.exh{display:flex;gap:10px;align-items:flex-start}

function renderTabs(){
  const tabs=[['home','Home',IC.home],['train','Train',IC.train],['plan','Plan',IC.plan],['build','Builder',IC.build],['whoop','WHOOP',IC.pulse],['progress','Progress',IC.prog],['supps','Supps',IC.supp],['habits','Habits',IC.hab]];
  document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab ${UI.tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[2]}<span>${t[1]}</span></button>`).join('');
}

/* =====================================================================
   HOME: one-screen summary of every tab. Every tile opens the matching data.
   ===================================================================== */
function weekVol(from){let sets=0,vol=0;for(let i=0;i<7;i++){const l=S.logs[addD(from,i)]||{};Object.keys(l).forEach(k=>{if(k[0]==='_')return;(l[k].sets||[]).forEach(s=>{if(s.d){sets++;vol+=(+s.w||0)*(+s.r||0)}})})}return{sets,vol}}
function renderHome(){
  const v=document.getElementById('view'),t=todayS(),d=inPlan(t)?t:(t<S.start?S.start:S.end),k=tplOf(d),tp=k&&T[k];
  const name=(S.prof&&S.prof.ans&&S.prof.ans.name)||'';const hr=new Date().getHours();
  let h=`<h2 class="pagetitle disp">${hr<12?'Good morning':hr<18?'Good afternoon':'Good evening'}${name?', '+esc(name):''}</h2><p class="sub">${nice(t)}. Tap any box to open it.</p>`;
  // today
  if(tp){const u=units(d),pct=pctOf(u),est=estimate(d),c=KCOLOR(tp.k),r=readyOf(d);
    h+=`<button class="htile hbig" style="--c:${c}" data-a="hgo" data-v="train" data-d="${d}"><div class="hrow2">${ring(pct,c,92,10,Math.round(pct*100)+'%')}<div style="min-width:0"><span class="hlab">${d===t?'Today':nice(d)}</span><b class="disp hval">${esc(tp.n)}</b><span class="hsub">${esc(tp.f)}${tp.k!=='rest'?' · about '+mins(est.total):''}${r?' · '+({g:'Green',y:'Yellow',r:'Red'}[r])+' day':''}</span><span class="hgo">${S.done[d]?'✓ Done. See it ›':tp.k==='rest'?'Rest day ›':pct>0?'Continue ›':'Start session ›'}</span></div></div></button>`}
  // week strip
  const ws=sunOf(t);let strip='';let done=0,sch=0;
  for(let i=0;i<7;i++){const dd=addD(ws,i),kk=tplOf(dd),tt=kk&&T[kk];const tr=isTraining(kk);if(tr){sch++;if(S.done[dd])done++}
    strip+=`<button class="hday ${dd===t?'now':''} ${S.done[dd]?'done':''}" style="--c:${tt?KCOLOR(tt.k):'var(--ln)'}" data-a="openday" data-d="${dd}"><span>${DS[i][0]}</span><i>${S.done[dd]?'✓':tt&&tt.k!=='rest'?esc(tt.k==='long'?'Z2':tt.k==='hiit'?'HIIT':tt.n.split(' ')[0].slice(0,3)):''}</i></button>`}
  h+=`<div class="htile" style="--c:var(--upper)"><div class="hhead"><span class="hlab">This week</span><button class="mini" data-a="hgo" data-v="plan">Plan ›</button></div><b class="disp hval">${done} of ${sch} sessions</b><div class="hweek">${strip}</div></div>`;
  h+=`<div class="hgrid">`;
  // WHOOP
  const ld=latestDay(),x=W(ld)||{};
  if(S.whoop.connected){const rc=x.rec!=null?recCol(x.rec):'#8E97BF';
    h+=`<button class="htile" style="--c:${rc}" data-a="hgo" data-v="whoop" data-m="rec">${ring((x.rec||0)/100,rc,64,8,x.rec!=null?Math.round(x.rec)+'%':'–')}<span class="hlab">Recovery</span><span class="hsub">HRV ${x.hrv!=null?x.hrv:'–'} · RHR ${x.rhr!=null?x.rhr:'–'}</span></button>`;
    const sl=x.sleep;h+=`<button class="htile" style="--c:${WC.sleep}" data-a="hgo" data-v="whoop" data-m="sleep">${ring(sl&&sl.perf!=null?sl.perf/100:0,WC.sleep,64,8,sl&&sl.perf!=null?Math.round(sl.perf)+'%':'–')}<span class="hlab">Sleep</span><span class="hsub">${sl?hm(sl.dur)+' asleep':'No data yet'}</span></button>`;
    h+=`<button class="htile" style="--c:${WC.strain}" data-a="hgo" data-v="whoop" data-m="strain">${ring((x.strain||0)/21,WC.strain,64,8,x.strain!=null?x.strain.toFixed(1):'–')}<span class="hlab">Strain</span><span class="hsub">${x.steps!=null?x.steps.toLocaleString()+' steps':(x.kcal!=null?x.kcal+' kcal':'Today')}</span></button>`;
    const wk=Object.values(S.wwk||{}).sort((a,b)=>a.start<b.start?1:-1)[0];
    h+=wk?`<button class="htile" style="--c:#FF6A13" data-a="wkopen" data-v="${wk.id}"><span class="hlab">Last workout</span><b class="disp hval">${esc(sportName(wk.sport))}</b><span class="hsub">${short(wk.d)} · strain ${wk.strain!=null?wk.strain.toFixed(1):'–'} · ${wk.ahr||'–'} bpm</span>${zoneBar(wk.zones,6)}</button>`:`<button class="htile" style="--c:#FF6A13" data-a="hgo" data-v="whoop"><span class="hlab">Workouts</span><b class="disp hval">–</b><span class="hsub">Synced from WHOOP</span></button>`;
  }else h+=`<button class="htile hspan" style="--c:#191A4A" data-a="hgo" data-v="whoop"><span class="hlab">WHOOP</span><b class="disp hval">Not connected</b><span class="hsub">Connect to see recovery, sleep, strain and workouts here</span></button>`;
  // cycle and intensity
  const ph=phaseOf(d),wi=weekInt(t);
  h+=`<button class="htile" style="--c:${PH_COLOR[ph.s]}" data-a="hgo" data-v="build"><span class="hlab">Cycle ${ph.c+1} · week ${ph.cw}/${ph.CL}</span><b class="disp hval">${ph.name}</b><div class="hbar"><i style="width:${ph.cw/ph.CL*100}%"></i></div><span class="hsub">${wi?'Intensity: '+(wi.lvl==='push'?'push':wi.lvl==='ease'?'ease off':'normal'):ph.focus}</span></button>`;
  // volume
  const tw=weekVol(ws),lw=weekVol(addD(ws,-7)),dv=lw.vol?(tw.vol-lw.vol)/lw.vol:null;
  h+=`<button class="htile" style="--c:var(--lower)" data-a="hgo" data-v="progress"><span class="hlab">Volume this week</span><b class="disp hval num">${tw.vol>=1000?(tw.vol/1000).toFixed(1)+'t':Math.round(tw.vol)+' kg'}</b><span class="hsub">${tw.sets} sets${dv!=null?` · <b style="color:${dv>=0?'var(--ok)':'var(--bad)'}">${dv>=0?'+':''}${Math.round(dv*100)}%</b> vs last week`:''}</span></button>`;
  // top lift
  const hs=hist(),top=Object.keys(hs).filter(e=>E[e]&&!E[e].bw&&!E[e].t).sort((a,b)=>hs[b].length-hs[a].length)[0];
  if(top){const pts=hs[top].map(q=>Math.max(...q.sets.map(s=>e1rm(+s.w,+s.r))));h+=`<button class="htile" style="--c:var(--upper)" data-a="lifthist" data-e="${top}"><span class="hlab">Top lift</span><b class="hval2">${esc(E[top].n)}</b>${spark(pts)}<span class="hsub">Best ${Math.round(Math.max(...pts))} kg est. 1RM</span></button>`}
  else h+=`<button class="htile" style="--c:var(--upper)" data-a="hgo" data-v="progress"><span class="hlab">Strength</span><b class="disp hval">–</b><span class="hsub">Log weights to see trends</span></button>`;
  // supplements
  const sl2=S.suppLog[t]||{},st=S.supps.filter(s=>sl2[s.id]).length;
  h+=`<button class="htile" style="--c:var(--cardio)" data-a="hgo" data-v="supps">${ring(S.supps.length?st/S.supps.length:0,COLORS.cardio,64,8,st+'/'+S.supps.length)}<span class="hlab">Supplements</span><span class="hsub">${S.supps.length?(st===S.supps.length?'All taken today':(S.supps.length-st)+' left today'):'Build your stack'}</span></button>`;
  // habits
  const hb=(S.habits||[]),hd=hb.filter(x=>habDone(x.id,t)).length;

function setTxt(e,q){const w=q.w!==''&&q.w!=null?q.w:null,r=q.r!==''&&q.r!=null?q.r:null;if(e.t)return(r||'–')+' s'+(e.u?' each side':'');if(e.bw||!w)return(r||'–')+' reps';return w+' kg × '+(r||'–')}
function workoutData(d){
  const k=tplOf(d),t=T[k],l=S.logs[d]||{},out={d,title:t?t.n:'Workout',focus:t?t.f:'',groups:[],sets:0,vol:0,reps:0};
  const take=(it,lab)=>{const o=l[it.slot];if(!o||o.ex!==it.ex)return null;let ss=o.sets.slice(0,Math.max(it.rx.sets,o.sets.length)).filter(q=>q.d);if(!ss.length)return null;const e=E[it.ex];
    ss.forEach(q=>{out.sets++;out.reps+=e.t?0:(+q.r||0);out.vol+=(+q.w||0)*(+q.r||0)});return{lab,n:e.n,sets:ss.map(q=>setTxt(e,q))}};
  blocksFor(d).forEach(b=>{const g={h:'Superset '+b.label,items:[]};b.items.forEach((it,i)=>{const x=take(it,b.label+(b.items.length>1?i+1:''));if(x)g.items.push(x)});if(g.items.length)out.groups.push(g)});
  const c={h:'Core',items:[]};coreFor(d).forEach((it,i)=>{const x=take(it,'C'+(i+1));if(x)c.items.push(x)});if(c.items.length)out.groups.push(c);
  const mob=mobFor(d),wu=warmFor(d);out.mob=[mob.filter(m=>isChk(d,m.slot)).length,mob.length];out.wu=[wu.filter(m=>isChk(d,m.slot)).length,wu.length];
  const cd=cardioFor(d);out.cardio=cd&&isChk(d,'cardio')?{mins:cd.mins,m:cd.m,z:cd.z}:null;
  out.dur=l._t0&&S.done[d]&&S.done[d].t>l._t0&&S.done[d].t-l._t0<4*36e5?Math.round((S.done[d].t-l._t0)/6e4):null;
  out.wk=S.whoop.connected?wkForDay(d):null;out.c=t?KCOLOR(t.k):COLORS.upper;return out;
}
function workoutText(w){
  let s=`IRON workout · ${nice(w.d)}\n${w.title}${w.focus?' ('+w.focus+')':''}\n`;
  s+=[w.dur?w.dur+' min':null,w.sets+' sets',w.vol?Math.round(w.vol).toLocaleString()+' kg volume':null,w.wk&&w.wk.strain!=null?'WHOOP strain '+w.wk.strain.toFixed(1):null].filter(Boolean).join(' · ')+'\n';
  w.groups.forEach(g=>{s+=`\n${g.h}\n`;g.items.forEach(x=>{s+=`• ${x.n}: ${x.sets.join(', ')}\n`})});
  if(w.cardio)s+=`\nCardio: ${w.cardio.mins} min, ${w.cardio.m}\n`;
  if(w.mob[1])s+=`Mobility: ${w.mob[0]}/${w.mob[1]} drills`+(w.wu[1]?` · Warm-up: ${w.wu[0]}/${w.wu[1]}`:'')+'\n';
  return s;
}
function workoutCanvas(w){

  const lines=[];// measure pass
  const wrap=(txt,font,max)=>{x.font=font;const words=txt.split(' ');const out=[];let cur='';words.forEach(wd=>{const tr=cur?cur+' '+wd:wd;if(x.measureText(tr).width>max&&cur){out.push(cur);cur=wd}else cur=tr});if(cur)out.push(cur);return out};
  w.groups.forEach(g=>{lines.push({t:'h',s:g.h});g.items.forEach(it=>{lines.push({t:'n',s:it.lab+'  '+it.n});wrap(it.sets.map((q,i)=>(i+1)+') '+q).join('    '),'400 30px '+F,W2-2*P-40).forEach(z=>lines.push({t:'s',s:z}))})});
  if(w.cardio){lines.push({t:'h',s:'Cardio'});lines.push({t:'n',s:w.cardio.mins+' min · '+w.cardio.m})}

  x.font='900 64px '+F;x.fillText(w.title,P,205);x.font='500 28px '+F;x.globalAlpha=.85;x.fillText((w.focus||'').slice(0,60),P,248);x.globalAlpha=1;
  const stats=[[w.dur?w.dur+' min':'–','Duration'],[String(w.sets),'Sets'],[w.vol?(w.vol>=1000?(w.vol/1000).toFixed(1)+' t':Math.round(w.vol)+' kg'):'–','Volume'],[w.wk&&w.wk.strain!=null?w.wk.strain.toFixed(1):(w.reps?String(w.reps):'–'),w.wk?'WHOOP strain':'Reps']];
  const bw=(W2-2*P-3*20)/4;stats.forEach((s2,i)=>{const bx=P+i*(bw+20),by=head-145;x.fillStyle='#fff';x.beginPath();x.roundRect?x.roundRect(bx,by,bw,120,24):x.rect(bx,by,bw,120);x.fill();x.fillStyle='#191A4A';x.font='900 40px '+F;x.fillText(s2[0],bx+22,by+58);x.fillStyle='#6B7399';x.font='600 22px '+F;x.fillText(s2[1],bx+22,by+96)});

  lines.forEach(l=>{if(l.t==='h'){y+=26;x.fillStyle=w.c;x.font='800 26px '+F;x.fillText(l.s.toUpperCase(),P,y);y+=44}else if(l.t==='n'){x.fillStyle='#191A4A';x.font='800 32px '+F;x.fillText(l.s,P,y);y+=46}else{x.fillStyle='#3A4166';x.font='400 30px '+F;x.fillText(l.s,P+40,y);y+=42}});

}

/* ---------- PROGRESS ---------- */
function planDays(){const a=[];for(let d=S.start;d<=S.end;d=addD(d,1))a.push(d);return a}
function analyze(){
  const t=todayS();const days=planDays().filter(d=>isTraining(tplOf(d)));
  const past=days.filter(d=>d<t||S.done[d]);const done=past.filter(d=>S.done[d]);
  const strPast=past.filter(d=>T[tplOf(d)].k!=='long');const strDone=strPast.filter(d=>S.done[d]);
  const adh=strPast.length?strDone.length/strPast.length:null;

  Object.keys(h).forEach(ex=>{const a=h[ex];if(a.length<2)return;tracked++;const f=Math.max(...a[0].sets.map(s=>e1rm(+s.w,+s.r))),l=Math.max(...a[a.length-1].sets.map(s=>e1rm(+s.w,+s.r)));if(l>f*1.01)up++});
  const prog=tracked?up/tracked:null;
  const reds=planDays().filter(d=>d<=todayS()&&readyOf(d)==='r').length;

    segs:(C.segs||[]).slice(),cycles:Object.assign({},C.cycles)});
  // cycle length: a new length starts with the next cycle, or right away if you ask for a fresh cycle
  const ws=sunOf(from),cy=cycleOf(ws);
  if(bd.cycleLen!==cy.CL||bd.newCycle){let sf,c0;if(cy.pos===0){sf=ws;c0=cy.c}else if(bd.newCycle){sf=ws;c0=cy.c+1}else{sf=addD(cycleStart(cy.c),cy.CL*7);c0=cy.c+1}
    N.segs=N.segs.filter(x=>x.from<sf);N.segs.push({from:sf,CL:bd.cycleLen,c0});Object.keys(N.cycles).forEach(k=>{if(+k>=c0)delete N.cycles[k]})}
  S.custom=N;S.customPrev=prev||'none';applyCustom();save();initBd();rerender();window.scrollTo(0,0);
  toast('Plan updated from '+short(from),()=>{undoBuild()});
}

function flatOf(t){return{sizes:t.blocks.map(b=>b.i.length),flags:t.blocks.map(b=>({opt:b.opt,arms:b.arms})),flat:t.blocks.flatMap(b=>b.i.map(x=>x.slice()))}}

function liftStats(x){const sets=x.sets.map(q=>({w:+q.w,r:+q.r}));const top=Math.max(...sets.map(q=>q.w));const vol=sets.reduce((a,q)=>a+q.w*q.r,0);const best=Math.max(...sets.map(q=>e1rm(q.w,q.r)));return{sets,top,vol,best,reps:sets.reduce((a,q)=>a+q.r,0)}}
function bigChart(pts,c){const W=320,H=120;if(pts.length<2)return'';const mn=Math.min(...pts),mx=Math.max(...pts),rg=mx-mn||1;const xy=pts.map((v,i)=>[(i/(pts.length-1)*(W-16)+8),(H-10-(v-mn)/rg*(H-28))]);
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin:6px 0 2px"><polyline points="${xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${xy.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${c}"/>`).join('')}<text x="8" y="12" font-size="10.5" fill="var(--mu)" font-weight="700">${Math.round(mx)} kg</text><text x="8" y="${H-1}" font-size="10.5" fill="var(--mu)" font-weight="700">${Math.round(mn)} kg</text></svg>`}

  const e=E[ex];if(!e)return;const all=(hist()[ex]||[]).slice(),c=COLORS.upper;
  if(!all.length){openSheet(`<h4 class="disp">${esc(e.n)}</h4><p class="muted" style="font-size:14px">No weights logged for this move yet. Log a set with a weight and it shows up here.</p><button class="cta ghost" data-a="close">Close</button>`);return}
  const st=all.map(liftStats),bestW=Math.max(...st.map(x=>x.top)),bestE=Math.max(...st.map(x=>x.best)),totV=st.reduce((a,x)=>a+x.vol,0);
  const first=st[0].best,last=st[st.length-1].best,chg=first?(last-first)/first:0;
  let prevTop=-1,prevBest=-1;const prW=st.map(x=>{const pr=x.top>prevTop&&prevTop>=0;prevTop=Math.max(prevTop,x.top);return pr}),prE=st.map(x=>{const pr=x.best>prevBest&&prevBest>=0;prevBest=Math.max(prevBest,x.best);return pr});
  let rows='';for(let i=all.length-1;i>=0;i--){const x=all[i],s2=st[i],k=tplOf(x.d),tn=k&&T[k]?T[k].n:'';const prev=i>0?st[i-1]:null;const dTop=prev?s2.top-prev.top:null;
    rows+=`<details class="lhs" ${i===all.length-1?'open':''}><summary><div><b>${nice(x.d)}</b>${prW[i]?'<em>Weight PR</em>':prE[i]?'<em>e1RM PR</em>':''}<br><span class="num">${s2.sets.length} set${s2.sets.length>1?'s':''} · top ${s2.top} kg${dTop?` (${dTop>0?'+':''}${+dTop.toFixed(1)})`:''}</span></div><span class="chev">${CHEV}</span></summary>
    <div class="lhsets num"><span class="hd">Set</span><span class="hd">Weight</span><span class="hd">Reps</span><span class="hd">Est. 1RM</span>${s2.sets.map((q,j)=>`<span>${j+1}</span><b>${q.w} kg</b><span>${q.r}</span><span>${Math.round(e1rm(q.w,q.r))} kg</span>`).join('')}</div>
    <div class="lhmeta num"><span>Volume <b>${Math.round(s2.vol).toLocaleString()} kg</b></span><span>Total reps <b>${s2.reps}</b></span><span>Best e1RM <b>${Math.round(s2.best)} kg</b></span>${tn?`<span>Session <b>${esc(tn)}</b></span>`:''}</div>
    <button class="mini" style="margin-top:8px" data-a="histday" data-d="${x.d}">Open this day →</button></details>`}
  openSheet(`<h4 class="disp">${esc(e.n)}</h4><p class="muted" style="font-size:13.5px;margin:0 0 8px">Every session you logged, newest first. Tap a session to see each set.</p>

function sqSwap(id,a){if(a.diet==='vegan'){if(id==='whey')return'plantprot';if(id==='omega3')return'algaeoil';if(SQ_ANIMAL.includes(id))return null}if(a.diet==='veg'){if(id==='omega3')return'algaeoil';if(['collagen','glucosamine','codliver','beefprot','uc2','greenlipped','bonebroth'].includes(id))return null}return id}
function sqRecommend(a){
  const sc={},why={},add=(id,p,r)=>{id=sqSwap(id,a);if(!id||!SUPP_DB.find(e=>e.id===id))return;sc[id]=(sc[id]||0)+p;(why[id]=why[id]||[]);if(r&&!why[id].includes(r))why[id].push(r)};
  (a.goals||[]).forEach(g=>(SQ_MAP[g]||[]).forEach(x=>add(...x)));
  (a.issues||[]).forEach(g=>(SQ_MAP[g]||[]).forEach(x=>add(...x)));
  if(a.fish==='no')add('omega3',2,'you rarely eat oily fish');
  if(a.protein==='no')add('whey',3,'you often miss your protein target');else if(a.protein==='sometimes'&&((a.goals||[]).some(g=>['muscle','strength','fatloss'].includes(g))))add('whey',1,'helps you hit your protein target');
  if(a.diet==='vegan'){add('b12',4,'vegan diets lack B12');add('creatine',1,'plant diets have no creatine');add('iodine',1,'often low on plant diets');add('algaeoil',1,'plant source of omega-3')}
  if(a.diet==='veg')add('b12',3,'often low without meat');
  if(a.caff==='love'&&(a.goals||[]).some(g=>['focus','energy','strength','endurance'].includes(g)))add('theanine',1,'smooths out caffeine');
  if(a.caff!=='avoid'&&(a.goals||[]).some(g=>['strength','endurance','energy'].includes(g)))add('caffeine',1,'before training');
  if((a.meds||[]).includes('pregnant')){add('folate',5,'needed in pregnancy');add('vitd',2,'pregnancy');add('choline',2,'baby brain development');add('iodine',1,'pregnancy');add(a.diet==='omni'||a.diet==='pesc'?'omega3':'algaeoil',2,'baby brain development')}
  add('vitd',1,'most people run low');add('magnesium',1,'most people eat too little');
  if(a.sex==='male'&&(a.goals||[]).includes('hormones'))add('tongkat',1,'male hormone support');
  if(a.sex==='female'&&(a.goals||[]).includes('hormones'))add('inositol',1,'hormone balance');
  const blocked=[];
  let list=Object.keys(sc).map(id=>({id,score:sc[id],why:why[id],e:SUPP_DB.find(e=>e.id===id),block:sqBlockedBy(id,a)}));
  list.filter(x=>x.block.length&&x.score>=2).forEach(x=>blocked.push(x));
  list=list.filter(x=>!x.block.length&&x.score>=2).sort((x,y)=>y.score-x.score);
  // vitamin K2 only alongside D3
  if(!list.find(x=>x.id==='vitd'))list=list.filter(x=>x.id!=='vitk2');
  return{list:list.slice(0,SQ_SIZE[a.size]||7),more:list.slice(SQ_SIZE[a.size]||7,(SQ_SIZE[a.size]||7)+4),blocked};
}

function habDone(id,d){const h=habById(id);if(h&&h.link){const ov=S.habOv&&S.habOv[id]&&S.habOv[id][d];if(ov!=null)return ov===1;const a=habAuto(h,d);if(a!==null)return a}return!!(S.habitLog[id]&&S.habitLog[id][d])}
function habToggle(id,d){const h=habById(id);if(!h)return;const cur=habDone(id,d);
  if(h.link){const a=habAuto(h,d);if(a!==null){S.habOv[id]=S.habOv[id]||{};if(!cur===a)delete S.habOv[id][d];else S.habOv[id][d]=cur?0:1;return}}
  S.habitLog[id]=S.habitLog[id]||{};if(S.habitLog[id][d])delete S.habitLog[id][d];else S.habitLog[id][d]=1}
function habStreak(id){let t=todayS(),n=0;if(!habDone(id,t))t=addD(t,-1);while(habDone(id,t)&&n<1000){n++;t=addD(t,-1)}return n}
function habBest(id){let best=0,cur=0;const t=todayS();for(let i=400;i>=0;i--){if(habDone(id,addD(t,-i))){cur++;best=Math.max(best,cur)}else cur=0}return best}
function linkText(h){const L=LINKS[h.link.k];return`${L.l} ${L.op} ${h.link.k==='sleep'?hm(h.link.t):h.link.t.toLocaleString()+(L.u&&L.u!=='steps'?' '+L.u:'')}`}
function guessLink(name){let m=name.match(/sleep[^\d]*(\d+(?:[.,]\d+)?)\s*(?:h|hr|hrs|hour|hours)\b/i)||name.match(/(\d+(?:[.,]\d+)?)\s*\+?\s*(?:h|hr|hrs|hours?)\b[^\d]*sleep/i);
  if(m){const t=parseFloat(m[1].replace(',','.'));if(t>=3&&t<=12)return{k:'sleep',t}}
  m=name.match(/(\d[\d,.]*)\s*\+?\s*steps?\b/i)||name.match(/steps?[^\d]*(\d[\d,.]*)/i);
  if(m){const t=parseInt(m[1].replace(/[,.]/g,''),10);if(t>=1000&&t<=60000)return{k:'steps',t}}
  return null}
function autoLinkHabits(){let n=0;(S.habits||[]).forEach(h=>{if(h.link||h.noAuto)return;const g=guessLink(h.n);if(g){h.link=g;n++}});if(n)save();return n}
function renderHabits(){

  if(!S.habits.length)h+=`<div class="card"><p style="margin:0">No habits yet. Tap <b>Add</b> to create your first one.</p></div>`;
  S.habits.forEach(x=>{
    const mk=UI.hm[x.id]||t.slice(0,7);const[y,mo]=mk.split('-').map(Number);const dim=new Date(y,mo,0).getDate();const first=new Date(y,mo-1,1).getDay();

      h+=`<div class="mnav"><button class="mini" data-a="habm" data-k="${x.id}" data-v="-1">‹</button><b>${MN[mo-1]} ${y}, ${doneM} of ${elig} days</b><button class="mini" data-a="habm" data-k="${x.id}" data-v="1">›</button></div><div class="hcal">${cells}</div>

    }

  });

}

function resetPanelDrag(){const pn=document.getElementById('panel'),sc=document.querySelector('#sheet .scrim');pn.style.transition='';pn.style.transform='';if(sc){sc.style.transition='';sc.style.opacity=''}}
function openSheet(html){resetPanelDrag();const pn=document.getElementById('panel');pn.innerHTML='<div class="grab"></div>'+html;document.getElementById('sheet').classList.remove('hide');pn.scrollTop=0}
function closeSheet(){document.getElementById('sheet').classList.add('hide');UI.pl=null;document.getElementById('panel').innerHTML='';resetPanelDrag()}
(function sheetDrag(){
  const sheet=document.getElementById('sheet'),pn=document.getElementById('panel'),sc=sheet.querySelector('.scrim');
  let sy=0,sx=0,lock=null,dy=0,mouse=false;
  const apply=d=>{dy=Math.max(0,d);pn.style.transition='none';pn.style.transform=`translateY(${dy}px)`;sc.style.transition='none';sc.style.opacity=String(Math.max(.15,1-dy/420))};
  const finish=()=>{if(lock!=='drag'){lock=null;return}lock=null;pn.style.transition='transform .22s cubic-bezier(.2,.8,.2,1)';sc.style.transition='opacity .22s';
    if(dy>Math.min(120,pn.clientHeight*.25)){pn.style.transform='translateY(105%)';sc.style.opacity='0';setTimeout(closeSheet,210)}else{pn.style.transform='';sc.style.opacity=''}dy=0};
  pn.addEventListener('touchstart',e=>{if(e.touches.length!==1){lock='scroll';return}sy=e.touches[0].clientY;sx=e.touches[0].clientX;lock=null;dy=0},{passive:true});
  pn.addEventListener('touchmove',e=>{if(e.touches.length!==1)return;const t=e.touches[0],ddy=t.clientY-sy,ddx=t.clientX-sx;
    if(lock===null){if(Math.abs(ddy)<8&&Math.abs(ddx)<8)return;lock=(ddy>0&&Math.abs(ddy)>Math.abs(ddx)*1.2&&pn.scrollTop<=0)?'drag':'scroll'}
    if(lock!=='drag')return;if(e.cancelable)e.preventDefault();apply(ddy-8)},{passive:false});
  pn.addEventListener('touchend',finish,{passive:true});pn.addEventListener('touchcancel',finish,{passive:true});
  pn.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||!e.target.closest('.grab'))return;mouse=true;sy=e.clientY;lock='drag';dy=0;try{pn.setPointerCapture(e.pointerId)}catch(_){}});
  pn.addEventListener('pointermove',e=>{if(mouse&&lock==='drag')apply(e.clientY-sy)});
  const up=()=>{if(mouse){mouse=false;finish()}};pn.addEventListener('pointerup',up);pn.addEventListener('pointercancel',up);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.classList.contains('hide'))closeSheet()});
})();

const PAT_NEAR={hpush:['fly','vpush','tri'],fly:['hpush'],vpush:['lat','hpush'],lat:['vpush','rear'],hpull:['vpull','rear'],vpull:['hpull','lat'],rear:['cuff','hpull'],cuff:['rear','lat'],tri:['hpush','vpush'],bi:['hpull','vpull'],

function altsFor(slot,base,cur){
  const MIN=5,MAX=8,out=[];const add=x=>{if(x&&E[x]&&x!==cur&&x!=='rampUp'&&!out.includes(x))out.push(x)};
  add(base);(E[base].a||[]).forEach(add);
  const mb=META[base];
  if(mb){
    const a=S.prof&&S.prof.ans,eqs=a?eqList(a.equip):null,inj=new Set((a&&a.inj)||[]);
    const score=id=>{const m=META[id];return(eqs&&!eqs.includes(m.eq)?4:0)+(m.av.some(j=>inj.has(j))?3:0)+Math.abs(m.lvl-mb.lvl)+(YT[id]?0:1)+(m.eq===mb.eq?-.5:0)+(!!E[id].t!==!!E[base].t?2:0)};
    const rank=pats=>Object.keys(META).filter(id=>E[id]&&pats.includes(META[id].pat)).sort((x,y)=>score(x)-score(y));
    for(const id of rank([mb.pat])){if(out.length>=MAX)break;add(id)}
    if(out.length<MIN)for(const id of rank(PAT_NEAR[mb.pat]||[])){if(out.length>=MIN)break;add(id)}

  const p=TM.phases[TM.i],rem=TM.paused?TM.left:(TM.end-Date.now())/1000;const C=2*Math.PI*20,frac=Math.max(0,rem)/p.s;

  case'vidchange':{const ex=el.dataset.e;const u=window.prompt('Paste a YouTube link (Shorts or normal) for '+E[ex].n+':','');if(u===null)break;const id=parseYT(u);if(!id){toast('That doesn\u2019t look like a YouTube link');break}S.vids[ex]=id;save();drawPlayer();toast('Video updated');break}

  case'doswap':{const slot=k,base=el.dataset.b,to=el.dataset.e,scope=el.dataset.s;const prev={day:S.swaps[d]&&S.swaps[d][slot],all:S.swapsAll[base]};

  case'toastundo':if(UI.undo){UI.undo();UI.undo=null;save();rerender()}document.getElementById('toast').classList.add('hide');break;

  case'sqgo':{const q=UI.sq;if(!(q.a.goals||[]).length&&!(q.a.issues||[]).filter(x=>x!=='none').length){toast('Pick at least one goal or issue');break}const R=sqRecommend(q.a);const cur=new Set(S.supps.map(x=>{const i=suppInfo(x.n);return i?i.id:null}));q.sel={};R.list.forEach(x=>{if(!(q.mode==='improve'&&cur.has(x.id)))q.sel[x.id]=true});q.view='r';drawSq();break}

  case'sqback':UI.sq.view='q';drawSq();break;
  case'sqsave':sqSave();break;
  case'obnext':{const st=OB_STEPS[UI.ob.step];if(st==='schedule'&&UI.ob.a.days.length<2){toast('Pick at least 2 lifting days');break}UI.ob.step=Math.min(OB_STEPS.length-1,UI.ob.step+1);if(OB_STEPS[UI.ob.step]==='suppq'&&UI.ob.a.supps!=='quiz')UI.ob.step++;drawOb();break}
  case'obpick':{const f=el.dataset.f,v=el.dataset.v;UI.ob.a[f]=isNaN(+v)?v:+v;drawOb();break}
  case'obtog':{const f=el.dataset.f,v=el.dataset.v;const arr=UI.ob.a[f]=UI.ob.a[f]||[];const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);drawOb();break}
  case'obday':{const v=+el.dataset.v,a2=UI.ob.a;const i=a2.days.indexOf(v);if(i>=0)a2.days.splice(i,1);else{if(a2.days.length>=6){toast('Six lifting days is the maximum');break}a2.days.push(v)}if(a2.days.includes(+a2.longDay))a2.longDay=-1;drawOb();break}
  case'obfinish':obFinish();break;
  case'mvmode':UI.mv={mode:el.dataset.v};moveSheet();break;
  case'dosched':{const mode=(UI.mv&&UI.mv.mode)||'move',tg=el.dataset.d;const last=d;if(doSchedule(mode,tg)){closeSheet();UI.date=mode==='move'?tg:d;rerender();toast((mode==='move'?'Moved to ':'Copied to ')+short(tg),()=>{undoSched()})}break}
  case'undosched':{const e=undoSched();if(e){closeSheet();rerender();toast('Undone: '+e.label)}else toast('Nothing to undo');break}
  case'resetsched':{if(resetSchedule()){rerender();toast('Schedule reset',()=>{undoSched()})}break}
  case'settings':settingsSheet();break;
  case'close':closeSheet();break;
  case'tadj':if(TM){const dv=+el.dataset.v;if(TM.paused)TM.left=Math.max(1,TM.left+dv);else TM.end=Math.max(Date.now()+1000,TM.end+dv*1000);drawTimer()}break;
  case'tpause':if(TM){if(TM.paused){TM.end=Date.now()+TM.left*1000;TM.paused=false}else{TM.left=(TM.end-Date.now())/1000;TM.paused=true}drawTimer()}break;
  case'tstop':TM=null;drawTimer();break;
  case'extend':{const ne=document.getElementById('extEnd').value;if(!ne||ne<=S.end){toast('Pick a date after '+short(S.end));break}const r=analyze().rec;S.ext.push({from:addD(S.end,1),to:ne,vol:r.vol,extra:r.extra,trim:r.trim});S.end=ne;save();rerender();toast('Plan extended to '+short(ne));break}
  case'unextend':{const x=S.ext.pop();if(x){S.end=addD(x.from,-1);save();rerender();toast('Extension removed')}break}
  case'supp':{const dd=UI.sday||todayS();S.suppLog[dd]=S.suppLog[dd]||{};if(S.suppLog[dd][k])delete S.suppLog[dd][k];else S.suppLog[dd][k]=1;if(!Object.keys(S.suppLog[dd]).length)delete S.suppLog[dd];save();rerender();break}

  case'sdaytoggle':{const dd=el.dataset.d;if(dd>todayS())break;S.suppLog[dd]=S.suppLog[dd]||{};if(S.suppLog[dd][k])delete S.suppLog[dd][k];else S.suppLog[dd][k]=1;if(!Object.keys(S.suppLog[dd]).length)delete S.suppLog[dd];save();rerender();break}
  case'sm':{const cur=UI.sm[k]||todayS().slice(0,7);const[y,m]=cur.split('-').map(Number);const nd=new Date(y,m-1+(+el.dataset.v),1);UI.sm[k]=nd.getFullYear()+'-'+pad(nd.getMonth()+1);rerender();break}

  case'delsupp':{const i=S.supps.findIndex(s=>s.id===k);if(i<0)break;const rem=S.supps.splice(i,1)[0];save();closeSheet();rerender();toast('Removed '+rem.n,()=>S.supps.splice(i,0,rem));break}
  case'addsupp':suppSheet();break;
  case'suppsave':{const n=document.getElementById('sn').value.trim();if(!n){toast('Add a name first');break}const inf=suppInfo(n);const o={n,d:document.getElementById('sd').value.trim()||(inf?inf.d.replace(/ daily$/,''):'1 serving'),slot:document.getElementById('ss').value,note:document.getElementById('snote').value.trim()||'',c:UI.sdraft.c};if(k){Object.assign(S.supps.find(q=>q.id===k),o);toast('Saved '+n)}else{S.supps.push(Object.assign({id:'s'+Date.now()},o));toast(inf?'Added '+n+'. Tap it to see benefits and best time.':'Added '+n)}save();closeSheet();rerender();break}

document.addEventListener('input',ev=>{const el=ev.target;if(!el.dataset)return;

});
document.addEventListener('change',ev=>{
  const el=ev.target;if(!el.dataset||!el.dataset.in)return;const t=el.dataset.in,k=el.dataset.k,d=UI.date;

    // copy the new value to the following sets of this move that are not ticked yet and were empty or still matched the old value
    if(nv!=='')for(let j=+i+1;j<o.sets.length;j++){const q=o.sets[j];if(q.d||!(q[t]===''||q[t]===old))continue;q[t]=nv;const inp=document.querySelector(`input[data-in="${t}"][data-k="${slot}|${j}"]`);if(inp)inp.value=nv}
    save();HISTCACHE=null}
  else if(t==='map'){const AM=activeMap();if(AM[k]!==el.value){snapSched(`${DN[k]}s changed from ${T[AM[k]].n} to ${T[el.value].n}`,[],[],true);AM[k]=el.value;save();rerender();toast(DN[k]+' is now '+T[el.value].n,()=>{undoSched()})}}
  else if(t==='mvdate'){if(el.value){const mode=(UI.mv&&UI.mv.mode)||'move';if(doSchedule(mode,el.value)){closeSheet();UI.date=mode==='move'?el.value:UI.date;rerender();toast((mode==='move'?'Moved to ':'Copied to ')+short(el.value),()=>{undoSched()})}}}
  else if(t==='bdday'){UI.bd.week[+k]=el.value;UI.bd.dirty=true;rerender()}
  else if(t==='bdname'){const v2=el.value.trim();if(v2)bdMut(x=>{x.n=v2})}
  else if(t==='start'){if(el.value&&el.value<S.end){S.start=el.value;save();rerender();toast('Plan now starts '+short(el.value))}}
  else if(t==='hlk'){const v2=el.value;document.getElementById('hlrow').classList.toggle('hide',!v2);if(v2){const L=LINKS[v2];document.getElementById('hllab').textContent='Done when '+L.l.toLowerCase()+' '+L.op+(L.u?' ('+L.u+')':'');document.getElementById('hlt').value=L.def}}
  else if(t==='sday'){if(el.value&&el.value<=todayS()){UI.sday=el.value;rerender()}}
  else if(t==='ob'&&UI.ob){UI.ob.a[el.dataset.f]=el.value;if(el.tagName==='SELECT')drawOb()}
  else if(t==='theme'){applyTheme(el.value);try{localStorage.setItem(KEY+'-theme',el.value)}catch(e){}}
});
function applyTheme(v){if(v==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v)}
try{applyTheme(localStorage.getItem(KEY+'-theme')||'auto')}catch(e){}
(function(){const q=new URLSearchParams(location.search);const w=q.get('whoop');if(w){history.replaceState(null,'',location.pathname);if(w==='connected'){S.whoop.last=0;save();if(!S.whoop.key)setTimeout(()=>toast('WHOOP connected. Go back to the IRON app on your home screen.'),300)}else setTimeout(()=>toast('WHOOP connection failed ('+(q.get('reason')||'unknown')+')'),300)}})();
applyProfile();applyCustom();UI.fresh=FRESH;
autoLinkHabits();
rerender();
if(FRESH)setTimeout(openOnboarding,250);
if(WH_ON&&(S.whoop.connected||S.whoop.pending))whoopSync(false);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&WH_ON&&(S.whoop.connected||S.whoop.pending))whoopSync(false)});
window.__S=()=>S;window.__est=estimate;window.__UI=UI;
})();
