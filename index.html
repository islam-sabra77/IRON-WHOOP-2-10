<style>
:root{
  --bg:#F3F5FF;--sf:#FFFFFF;--sf2:#EBEEFF;--ink:#191A4A;--mu:#5E6390;--ln:#DCE1F7;
  --upper:#2F5BFF;--lower:#FF6A13;--mob:#00B39A;--core:#E8A900;--cardio:#FF2D78;--long:#7B4DFF;--rest:#8E97BF;--travel:#00A3FF;--warm:#43A512;
  --ok:#12B76A;--warn:#F59E0B;--bad:#EF3B55;
  --shadow:0 1px 0 rgba(25,26,74,.04),0 6px 18px rgba(47,91,255,.07);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F2E;--sf:#181A45;--sf2:#23265C;--ink:#EEF0FF;--mu:#A5AAD8;--ln:#2D3170;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0F2E;--sf:#181A45;--sf2:#23265C;--ink:#EEF0FF;--mu:#A5AAD8;--ln:#2D3170;--shadow:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--upper);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 170px}
.disp{font-stretch:68%;font-weight:850;letter-spacing:-.01em;line-height:.95}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mu)}
.hide{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topin{max-width:760px;margin:0 auto;padding:10px 14px 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{margin:0;font-size:26px}
.brand h1 img.wm{width:auto!important;height:26px!important;border-radius:0!important;box-shadow:none!important;border:0!important;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wm{filter:invert(1) brightness(1.2)}}
:root[data-theme="dark"] .wm{filter:invert(1) brightness(1.2)}
.brand h1.brandlogo{min-height:42px;display:flex;align-items:center;gap:10px;letter-spacing:.06em}.brand h1 img{width:38px;height:38px;border-radius:10px;box-shadow:0 1px 6px rgba(25,26,74,.18);border:1px solid var(--ln)}
.brand h1 i{font-style:normal;display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--lower);margin-right:4px;box-shadow:14px 0 0 var(--upper),28px 0 0 var(--cardio);margin-right:36px;vertical-align:2px}
.icbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center}
.icbtn svg{width:20px;height:20px}
.strip{display:flex;align-items:center;gap:6px;margin-top:10px}
.strip .arrow{flex:0 0 34px;height:58px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-size:18px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dchip{height:58px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;position:relative}
.dchip small{font-size:11px;color:var(--mu);font-weight:600}
.dchip b{font-size:17px;font-weight:800}
.dchip .bar{width:18px;height:4px;border-radius:2px;background:var(--c,transparent)}
.dchip.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dchip.sel small{color:inherit;opacity:.75}
.dchip.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--cardio)}
.dchip.done .bar{height:6px;width:24px}
.dchip.off{opacity:.4}
.weeklab{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--mu);font-weight:600}
.linkbtn{border:0;background:none;color:var(--upper);font-weight:700;padding:4px 0}

/* hero */
.hero{--c:var(--upper);background:var(--c);color:#fff;border-radius:26px;padding:18px 18px 16px;margin:10px 0 14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .when{font-size:14px;font-weight:600;opacity:.92;position:relative}
.hero h2{font-size:clamp(50px,15vw,76px);margin:6px 0 2px;position:relative}
.hero .focus{font-size:18px;font-weight:700;position:relative}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative}
.tag{font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.2)}
.seg{display:flex;gap:4px;margin-top:16px;position:relative}
.seg>div{height:12px;border-radius:6px;background:rgba(255,255,255,.28);overflow:hidden;min-width:14px}
.seg>div>span{display:block;height:100%;background:#fff;border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.seglab{display:flex;gap:4px;margin-top:6px;font-size:12px;font-weight:700;position:relative}
.seglab>span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:14px;opacity:.92}
.hero-actions{display:flex;gap:8px;margin-top:14px;position:relative;flex-wrap:wrap}
.sechead{width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.chev{flex:0 0 30px;height:30px;border-radius:9px;background:var(--sf2);display:grid;place-items:center;transition:transform .2s}
.chev svg{width:16px;height:16px}
.closed .chev{transform:rotate(-90deg)}
.csum{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:4px 12px;margin-bottom:10px}
.crow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--ln);font-size:14px;font-weight:650}
.crow:first-child{border-top:0}
.crow .l2{font-size:11.5px;font-weight:850;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:7px;text-align:center;padding:3px 0}
.crow b{font-size:12.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.crow.full b{color:var(--ok)}
.crow.full span:nth-child(2){text-decoration:line-through;text-decoration-color:var(--ok);opacity:.7}
.exh{cursor:pointer}
.exh .chev{margin-left:auto}
.ex.shut .exh .chev{transform:rotate(-90deg)}
.prog-chip{display:inline-block;margin-top:4px;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--sf2);color:var(--mu)}
.ex.complete .prog-chip{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.chead h4,.chead h5{margin:0!important}
.chead+*{margin-top:10px}
.tvcard{border-radius:24px;overflow:hidden;margin-bottom:12px;background:var(--sf);border:1px solid var(--ln);box-shadow:var(--shadow)}
.tvtop{background:var(--travel);color:#fff;padding:14px 16px;position:relative;overflow:hidden}
.tvtop::after{content:"";position:absolute;right:-30px;bottom:-50px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14)}
.tvtop h3{margin:2px 0 0;font-size:44px}
.tvtop .focus{font-weight:700;font-size:15px}
.tvtop .tags{margin-top:8px}
.tvbody{padding:10px 14px 14px}
.tvbody .grp{font-size:13px;font-weight:800;color:var(--mu);margin:10px 0 2px}
.trip{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.trip div{flex:1}
.trip span{display:block;font-size:12.5px;color:var(--mu)}
.fl{font-size:12.5px;font-weight:750;color:var(--mu)}
.fl{display:block}.grid2>*{min-width:0}input[type=date]{min-width:0;max-width:100%;display:block;-webkit-appearance:none;appearance:none}
.hbtn{border:0;border-radius:12px;padding:9px 13px;font-weight:750;font-size:14px;background:rgba(255,255,255,.22);color:#fff}
.hbtn.solid{background:#fff;color:var(--c)}
.big-pct{position:absolute;right:18px;top:16px;font-size:34px;text-align:right}
.big-pct small{display:block;font-size:12px;font-stretch:100%;font-weight:700;opacity:.85}

/* readiness */
.ready{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px;align-items:center;margin:0 0 14px}
.ready>span{font-size:13px;font-weight:700;color:var(--mu);padding-right:4px}
.rbtn{min-height:52px;border:1.5px solid var(--ln);background:var(--sf);border-radius:12px;padding:8px 4px;font-size:13px;font-weight:750;line-height:1.15}
.rbtn small{display:block;font-weight:600;font-size:11px;color:var(--mu)}
.rbtn[data-v="g"].on{background:var(--ok);border-color:var(--ok);color:#fff}
.rbtn[data-v="y"].on{background:var(--warn);border-color:var(--warn);color:#fff}
.rbtn[data-v="r"].on{background:var(--bad);border-color:var(--bad);color:#fff}
.rbtn.on small{color:#fff;opacity:.9}

/* sections */
.sec{margin:18px 0 8px}
.sechead{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.sechead .sq{width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px}
.sechead h3{margin:0;font-size:26px;flex:1}
.sechead .cnt{font-size:13px;font-weight:750;color:var(--mu);text-align:right;line-height:1.2}
.note{background:var(--sf2);border-radius:14px;padding:10px 12px;font-size:14px;margin:0 0 10px}
.note b{font-weight:800}

/* mobility rows */
.mlist{background:var(--sf);border-radius:20px;border:1px solid var(--ln);overflow:hidden;box-shadow:var(--shadow)}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--ln)}
.mrow:first-child{border-top:0}
.mrow.done .mi b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--mob);opacity:.6}
.mi{flex:1;min-width:0}
.mi b{display:block;font-weight:750;font-size:15px}
.mi span{font-size:13px;color:var(--mu)}
.mi details summary{list-style:none;cursor:pointer}
.mi details summary::-webkit-details-marker{display:none}
.mi .cue{font-size:13px;margin-top:4px;color:var(--ink)}
.chipinj{display:inline-block;font-size:11px;font-weight:750;padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--mob)) 15%,transparent);color:var(--c,var(--mob));margin:3px 4px 0 0}
.tick{flex:0 0 40px;width:40px;height:40px;border-radius:12px;border:2px solid var(--ln);background:var(--sf);display:grid;place-items:center;padding:0}
.tick svg{width:20px;height:20px;opacity:0}
.tick.on{background:var(--c,var(--ok));border-color:var(--c,var(--ok));color:#fff}
.tick.on svg{opacity:1}
.mini{border:1px solid var(--ln);background:var(--sf2);border-radius:10px;height:36px;min-width:36px;padding:0 9px;font-size:13px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;white-space:nowrap}
.mini svg{width:16px;height:16px}
.mini.play{background:var(--c,var(--mob));border-color:transparent;color:#fff}
.mini.yt{color:#E11D48}

/* exercise cards */
.block{margin:0 0 12px;position:relative}
.block.ss{background:color-mix(in srgb,var(--c) 9%,var(--bg));border-radius:24px;padding:10px;border:1.5px dashed color-mix(in srgb,var(--c) 45%,transparent)}
.sslab{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;color:var(--c);padding:2px 6px 8px}
.ex{background:var(--sf);border-radius:20px;border:1px solid var(--ln);padding:12px;box-shadow:var(--shadow)}
.block.ss .ex+.ex{margin-top:8px}
.exh{display:flex;gap:10px;align-items:flex-start}

const WK_OFF=[0,1,2,0,1];                 // rep target added each week
const WK_MAINSET=[0,0,0,1,1];             // extra set on main lifts in weeks 4-5
const WK_RIR={F:['3','3','2','2','1'],H:['3','2','2','2','1'],S:['2','2','1','2','1']};

function weekNo(d){return Math.floor(diffD(sunOf(S.start),sunOf(d))/7)+1}
function totalWeeks(){return weekNo(S.end)}
function phaseOf(d){
  const w=Math.max(1,weekNo(d)),c=Math.floor((w-1)/6),pos=(w-1)%6;

  return {w,c,b:c,pos,s,deload,cw:pos+1,name:deload?'Deload':SCH[s].name,focus:WK_FOCUS[pos],rir:deload?'4':WK_RIR[s][pos]};
}
/* every other cycle, accessories and arm moves rotate to a sister exercise; main lifts stay so strength keeps building */
const ROT={incMach:'incDB',incDB:'incMach',csRow:'sealRow',sealRow:'csRow',lmPress:'saDBPress',saDBPress:'machShoulder',cLat:'machLat',dbLat:'cLat',ropePush:'vbarPush',vbarPush:'ropePush',hammer:'crossHammer',ropeHammer:'hammer',saCableRow:'machRow',machChest:'floorPress',revPec:'cRearFly',cRearFly:'revPec',preacherM:'cableCurl',cableCurl:'dbCurl',crossExt:'kickback',rfess:'revLunge',seatHam:'lyingHam',legPress:'hackSq',standCalf:'slCalf',dbRDL:'slRDL',stepUp:'splitSq',legExt:'spanishSq',seatCalf:'standCalf',backExt45:'pullThrough'};

function extAt(d){return S.ext.find(x=>d>=x.from&&d<=x.to)||null}
function rangeOf(r){if(typeof r==='number')return[r,r];const m=String(r).match(/(\d+)(?:-(\d+))?/);return m?[+m[1],+(m[2]||m[1])]:[8,10]}
function rx(role,d,dose,isT){
  const ph=phaseOf(d),off=ph.deload?0:WK_OFF[ph.pos];
  if(role==='tw'){let sets=ph.s==='S'?4:3;const add={F:0,H:2,S:4}[ph.s]+off;if(ph.deload)sets=2;if(readyOf(d)==='y')sets--;sets=Math.max(1,sets);
    const v=isT?dose+(ph.deload?0:add*5):String(dose+(ph.deload?0:add));return{sets,reps:v,rir:ph.rir,rest:60}}
  const sc=SCH[ph.s];let[sets,base]=sc[role];let rir=ph.rir;
  let reps=role==='coreT'?base+off*5:(role==='pre'?base:base+off);
  if(role==='main'&&!ph.deload)sets+=WK_MAINSET[ph.pos];
  const ex=extAt(d);if(ex&&ex.vol>0&&role==='arm')sets+=1;if(ex&&ex.vol<0&&(role==='acc'||role==='arm'))sets-=1;
  if(ph.deload){sets=2;rir='4'}
  if(readyOf(d)==='y'&&(role==='acc'||role==='arm'||role==='pre'))sets--;
  if(readyOf(d)==='y'&&role==='main'&&!ph.deload&&+rir<2)rir='2';
  sets=Math.max(1,Math.min(5,sets));
  let rest=REST[role];if(ph.s==='S'&&role==='main')rest=150;if(ex&&ex.vol>0&&(role==='acc'||role==='arm'))rest=45;if(ex&&ex.vol>0&&role==='pre')rest=30;
  return{sets,reps:role==='coreT'?reps:String(reps),rir,rest};
}

/* ---------- WHOOP ---------- */
const WH_ON=location.protocol==='https:'||location.hostname==='localhost';
function wKey(){if(!S.whoop.key){S.whoop.key=(crypto.randomUUID()+crypto.randomUUID()).replace(/-/g,'');save()}return S.whoop.key}
function wAvg(d,key){const vals=[];for(let i=1;i<=30;i++){const x=S.wdata[addD(d,-i)];if(x&&x[key]!=null&&!x.cal)vals.push(+x[key])}return vals.length>=5?vals.reduce((a,b)=>a+b,0)/vals.length:null}
function whoopDay(d){
  const x=S.wdata&&S.wdata[d];if(!x||x.rec==null)return null;
  const hb=wAvg(d,'hrv'),rb=wAvg(d,'rhr');
  const hrvD=hb&&x.hrv!=null?(x.hrv-hb)/hb:null,rhrD=rb&&x.rhr!=null?x.rhr-rb:null;
  let lvl=x.rec>=67?'g':x.rec>=34?'y':'r';const why=[`Recovery ${Math.round(x.rec)}%`];
  let drop=false;
  if(hrvD!=null&&hrvD<=-0.10){drop=true;why.push(`HRV ${Math.round(-hrvD*100)}% below your 30-day average`)}
  if(rhrD!=null&&rhrD>=5){drop=true;why.push(`resting HR ${Math.round(rhrD)} bpm above your average`)}
  if(drop&&lvl!=='r')lvl=lvl==='g'?'y':'r';
  return{...x,lvl,hb,rb,hrvD,rhrD,drop,why}
}
function readyOf(d){if(S.ready[d])return S.ready[d];if(S.whoop&&S.whoop.connected&&S.whoop.auto){const w=whoopDay(d);if(w)return w.lvl}return''}
function lowStreak(d){let n=0;for(let i=0;i<3;i++){const w=whoopDay(addD(d,-i));if(w&&w.lvl!=='g')n++;else break}return n}
function isoToLocal(iso){return ds(new Date(iso))}
async function whoopSync(force){
  if(!WH_ON||!S.whoop.key)return;if(!force&&!S.whoop.pending&&Date.now()-(S.whoop.last||0)<20*60*1000)return;
  try{const r=await fetch('/api/whoop-data?days=90',{cache:'no-store',headers:{'x-iron-key':S.whoop.key}});
    if(r.status===401){if(S.whoop.pending&&Date.now()-S.whoop.pending>15*60*1000){S.whoop.pending=0;save()}if(S.whoop.connected){S.whoop.connected=false;save();rerender();toast('WHOOP disconnected. Reconnect in Settings.')}return}
    if(!r.ok){if(force)toast('WHOOP sync failed. Try again in a minute.');return}
    const j=await r.json();const wasNew=!S.whoop.connected;S.whoop.connected=true;S.whoop.pending=0;S.whoop.last=Date.now();if(wasNew)setTimeout(()=>toast('WHOOP connected'),200);
    const slp={},cyc={};(j.sleeps||[]).forEach(x=>slp[x.id]=x);(j.cycles||[]).forEach(x=>cyc[x.id]=x);
    const hrs=v=>v!=null?Math.round(v/36e3)/100:null;
    (j.records||[]).forEach(x=>{if(x.state!=='SCORED'||!x.created_at)return;const sl=slp[x.sleep_id],cy=cyc[x.cycle_id];
      const asleep=sl&&sl.inBed!=null?sl.inBed-(sl.awake||0):null;
      S.wdata[isoToLocal(x.created_at)]={rec:x.rec,hrv:x.hrv!=null?Math.round(x.hrv*10)/10:null,rhr:x.rhr,spo2:x.spo2!=null?Math.round(x.spo2*10)/10:null,skin:x.skin!=null?Math.round(x.skin*10)/10:null,cal:!!x.calibrating,
        sleep:sl?{perf:sl.perf,eff:sl.eff!=null?Math.round(sl.eff):null,cons:sl.cons,rr:sl.rr!=null?Math.round(sl.rr*10)/10:null,dur:hrs(asleep),light:hrs(sl.light),deep:hrs(sl.deep),rem:hrs(sl.rem),awake:hrs(sl.awake),need:hrs(sl.need),dist:sl.dist,bed:sl.start,wake:sl.end}:null,
        strain:cy&&cy.strain!=null?Math.round(cy.strain*10)/10:null,kcal:cy&&cy.kj!=null?Math.round(cy.kj/4.184):null,ahr:cy?cy.ahr:null,mhr:cy?cy.mhr:null}});
    save();rerender();if(force)toast('WHOOP synced');
  }catch(e){if(force)toast('Couldn\u2019t reach WHOOP')}
}
function whoopCard(d){

}

/* ---------- plan resolution ---------- */
const inPlan=d=>d>=S.start&&d<=S.end;
const isLift=k=>!!k&&!!T[k]&&(T[k].k==='upper'||T[k].k==='lower');
function tripAt(d){return(S.trips||[]).find(x=>d>=x.from&&d<=x.to)||null}
function tplOf(d){if(!inPlan(d))return null;if(S.moves[d])return S.moves[d];const b=S.map[dow(d)]||'rest';const tr=tripAt(d);
  if(tr&&isLift(b)){let n=0;for(let x=tr.from;x<d;x=addD(x,1)){if(isLift(S.moves[x]||S.map[dow(x)]))n++}return TRAVEL[n%4]}return b}
function exAt(d,slot,base){const p=S.swaps[d]&&S.swaps[d][slot];return p||S.swapsAll[base]||base}
function blocksFor(d){
  const k=tplOf(d);if(!k)return[];const t=T[k];if(!t.blocks)return[];
  if(readyOf(d)==='r')return[];
  const ex=extAt(d);
  let out=t.blocks.map((b,bi)=>({...b,key:'s'+bi})).filter(b=>!(ex&&(ex.trim||ex.extra)&&b.opt));
  if(ex&&ex.extra&&EXTRA[t.k])out.push({...EXTRA[t.k],key:'sx'});
  return out.map((b,idx)=>({...b,label:String.fromCharCode(65+idx),items:b.i.map((it,ii)=>{
    const slot=b.key+'-'+ii,b0=rotated(it[0],it[1],d),ex2=exAt(d,slot,b0);return{slot,base:b0,orig:it[0],ex:ex2,role:it[1],rx:rx(it[1],d,E[ex2].t===E[b0].t?it[2]:(E[ex2].t?(E[ex2].s||30):10),!!E[ex2].t)}})}));
}
function coreFor(d){const t=T[tplOf(d)];if(!t||!t.core)return[];return t.core.map((c,i)=>{const slot='c'+i;return{slot,base:c[0],ex:exAt(d,slot,c[0]),role:c[1],rx:rx(c[1],d)}})}
function listFor(d,kind){const t=T[tplOf(d)];if(!t)return[];const src=kind==='wu'?(t.wu&&readyOf(d)!=='r'?WU[t.wu]:null):MOB[t.mob];if(!src)return[];const pre=kind==='wu'?'w':'m';return src.map((m,i)=>{const slot=pre+i;const ex=exAt(d,slot,m[0]);let dose=m[1];if(ex!==m[0]){const b=E[m[0]],a=E[ex];if(a.t&&!b.t)dose=a.s||30;else if(!a.t&&b.t)dose=8}return{slot,base:m[0],ex,dose,kind}})}
const mobFor=d=>listFor(d,'mob'),warmFor=d=>listFor(d,'wu');
function secsOf(it){const e=E[it.ex];if(!e.t)return 0;return typeof it.rx.reps==='number'?it.rx.reps:(e.s||30)}
function repTxt(it){const e=E[it.ex];if(e.t)return secsOf(it)+' s'+(e.u?' / side':'');return it.rx.reps+(e.u?' / side':'')}

/* ---------- time estimate & cardio ---------- */
function listSecs(l){return l.reduce((a,m)=>{const e=E[m.ex],u=e.u?2:1;return a+(e.t?m.dose*u:m.dose*3*u)+15},0)}
const mobSecs=d=>listSecs(mobFor(d)),warmSecs=d=>listSecs(warmFor(d).map(m=>m.ex==='rampUp'?{...m,dose:20}:m));
function itemWork(it){const e=E[it.ex],u=e.u?2:1;if(e.t)return secsOf(it)*u+10;return rangeOf(it.rx.reps)[1]*3.2*u+10}
function blockSecs(b){const rounds=Math.max(...b.items.map(x=>x.rx.sets));const work=b.items.reduce((a,x)=>a+itemWork(x),0)+(b.items.length>1?10:0);const rest=Math.max(...b.items.map(x=>x.rx.rest));return rounds*(work+rest)+(b.items.some(x=>x.role==='main')?45:0)+60}
function strSecs(d){return blocksFor(d).reduce((a,b)=>a+blockSecs(b),0)}
function coreSecs(d){const c=coreFor(d);if(!c.length)return 0;return blockSecs({items:c})}
function cardioFor(d){
  const k=tplOf(d);if(!k)return null;const t=T[k],ph=phaseOf(d);
  if(t.k==='long'){const base=[40,45,50,55,55,35][ph.pos]+5*Math.min(ph.c,1);return{mins:Math.min(60,base),m:'Your choice: incline walk, outdoor walk, bike, swim or elliptical',z:'z2',long:1}}
  if(t.k==='rest')return null;
  if(t.k==='travel')return{mins:readyOf(d)==='r'?20:t.cardio.mins,m:readyOf(d)==='r'?'Easy walk outside or in the hotel':'Low-impact bodyweight circuit',z:readyOf(d)==='r'?'z2':'circ',moves:t.cardio.moves};
  if(readyOf(d)==='r')return{mins:30,m:'Easy walk or bike',z:'z2'};
  const used=(mobSecs(d)+warmSecs(d)+strSecs(d)+coreSecs(d))/60;
  const mins=Math.max(10,Math.min(20,Math.round(84-used)));

function cardioPhases(c){
  if(c.z==='int'){const rounds=Math.max(4,Math.floor((c.mins*60-300)/90));const p=[{l:'Warm-up, easy spin',s:120}];for(let i=1;i<=rounds;i++){p.push({l:'Hard '+i+'/'+rounds,s:30});p.push({l:'Easy '+i+'/'+rounds,s:60})}p.push({l:'Cool-down',s:Math.max(60,c.mins*60-120-rounds*90)});return p}
  if(c.z==='circ'){const p=[];const n=c.mins;for(let i=0;i<n;i++){p.push({l:c.moves[i%c.moves.length]+' ('+(i+1)+'/'+n+')',s:40});if(i<n-1)p.push({l:'Easy breathing',s:20})}return p}
  return[{l:'Zone 2',s:c.mins*60}];
}
function estimate(d){const m=mobSecs(d)/60,w=warmSecs(d)/60,s=strSecs(d)/60,c=coreSecs(d)/60,cd=cardioFor(d);return{m,w,s,c,cd:cd?cd.mins:0,total:m+w+s+c+(cd?cd.mins:0)}}

/* ---------- logs ---------- */
function L(d){return S.logs[d]||(S.logs[d]={})}
function slotLog(d,slot,ex,n){const l=L(d);let o=l[slot];if(!o||o.ex!==ex){o=l[slot]={ex,sets:[]}}while(o.sets.length<n)o.sets.push({w:'',r:'',d:0});return o}
function isChk(d,k){return!!(S.logs[d]&&S.logs[d]._x&&S.logs[d]._x[k])}
function setChk(d,k,v){const l=L(d);l._x=l._x||{};if(v)l._x[k]=1;else delete l._x[k]}
function units(d){
  const k=tplOf(d);const r={mob:[0,0],wu:[0,0],str:[0,0],core:[0,0],cardio:[0,0]};if(!k)return r;
  mobFor(d).forEach(m=>{r.mob[1]++;if(isChk(d,m.slot))r.mob[0]++});
  warmFor(d).forEach(m=>{r.wu[1]++;if(isChk(d,m.slot))r.wu[0]++});
  blocksFor(d).forEach(b=>b.items.forEach(it=>{const l=S.logs[d]&&S.logs[d][it.slot];const n=it.rx.sets;r.str[1]+=n;if(l&&l.ex===it.ex)r.str[0]+=l.sets.slice(0,n).filter(s=>s.d).length}));
  coreFor(d).forEach(it=>{const l=S.logs[d]&&S.logs[d][it.slot];const n=it.rx.sets;r.core[1]+=n;if(l&&l.ex===it.ex)r.core[0]+=l.sets.slice(0,n).filter(s=>s.d).length});
  if(cardioFor(d)){r.cardio[1]=1;if(isChk(d,'cardio'))r.cardio[0]=1}
  return r;
}
function pctOf(u){const ks=['mob','wu','str','core','cardio'];const a=ks.reduce((x,k)=>x+u[k][0],0),b=ks.reduce((x,k)=>x+u[k][1],0);return b?a/b:0}
const isTraining=k=>k&&(T[k].k==='upper'||T[k].k==='lower'||T[k].k==='long'||T[k].k==='travel');

/* ---------- progression engine ---------- */
let HISTCACHE=null;
function hist(){if(HISTCACHE)return HISTCACHE;const h={};Object.keys(S.logs).sort().forEach(d=>{const l=S.logs[d];Object.keys(l).forEach(k=>{if(k[0]==='_')return;const o=l[k];if(!o||!o.ex)return;const sets=o.sets.filter(s=>s.d&&s.w!==''&&s.r!=='');if(!sets.length)return;(h[o.ex]=h[o.ex]||[]).push({d,sets})})});return HISTCACHE=h}
function lastPerf(ex,d){const a=(hist()[ex]||[]).filter(x=>x.d<d);return a.length?a[a.length-1]:null}
function roundTo(x,s){return Math.round(x/s)*s}
function suggest(it,d){
  const lp=lastPerf(it.ex,d);if(!lp)return null;
  const ph=phaseOf(d),lph=phaseOf(lp.d),tgt=rangeOf(it.rx.reps)[1];
  const top=Math.max(...lp.sets.map(s=>+s.w)),reps=lp.sets.map(s=>+s.r);
  const lower=['main','sec'].includes(it.role)&&T[tplOf(d)]&&T[tplOf(d)].k==='lower';
  const inc=lower?5:(['acc','arm','pre'].includes(it.role)?1:2.5),step=inc>=2.5?2.5:1;
  let w=top,why;
  if(ph.deload){w=roundTo(top*0.85,step);why='Deload: about 15% lighter, crisp reps'}
  else if(lph.c!==ph.c||lph.deload){
    const recent=(hist()[it.ex]||[]).filter(x=>x.d<d&&diffD(x.d,d)<=49&&!phaseOf(x.d).deload);
    const best=Math.max(...(recent.length?recent:[lp]).flatMap(x=>x.sets.map(s=>e1rm(+s.w,+s.r))));
    w=roundTo(best/(1+(tgt+(+ph.rir||2))/30),step);why=`New cycle: set from your strength for ${tgt} reps`}
  else if(ph.pos===3&&lph.pos<3){w=top+inc;why='Week 4: add weight, reps reset'}
  else if(reps.every(r=>r>=tgt+2)){w=top+inc;why='That was easy, add weight'}
  else if(reps.filter(r=>r<tgt-2).length>=2){w=roundTo(top*0.95,step);why='Missed the target twice, trim a little'}
  else why=`Same weight, aim for ${tgt} reps`;
  return{lp,w:+Math.max(0,w).toFixed(1),why};
}
function e1rm(w,r){return w*(1+r/30)}

function renderTabs(){
  const tabs=[['train','Train',IC.train],['travel','Travel',IC.travel],['plan','Plan',IC.plan],['whoop','WHOOP',IC.pulse],['progress','Progress',IC.prog],['supps','Supps',IC.supp],['habits','Habits',IC.hab]];
  document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab ${UI.tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[2]}<span>${t[1]}</span></button>`).join('');
}

/* ---------- TRAIN ---------- */
function renderTrain(){
  const d=UI.date,k=tplOf(d),v=document.getElementById('view');
  if(!k){v.innerHTML=`<div class="card" style="margin-top:14px"><h4 class="disp">No session on this date</h4><p class="muted">Your plan runs ${nice(S.start)} to ${nice(S.end)}.</p><button class="cta" style="--c:var(--upper)" data-a="gostart">Go to day one</button></div>`;return}
  const t=T[k],c=KCOLOR(t.k),u=units(d),pct=pctOf(u),est=estimate(d),ph=phaseOf(d),moved=!!S.moves[d];
  let h='';
  // hero
  const segs=[['Mob',est.m,u.mob],['Warm',est.w,u.wu],['Strength',est.s,u.str],['Core',est.c,u.core],['Cardio',est.cd,u.cardio]].filter(s=>s[1]>0.5&&s[2][1]>0);
  h+=`<section class="hero" style="--c:${c}">
    <div class="big-pct disp num">${Math.round(pct*100)}%<small>done</small></div>
    <div class="when">${nice(d)}</div>
    <h2 class="disp">${t.n}</h2>
    <div class="focus">${t.f}</div>
    <div class="tags"><span class="tag">About ${mins(est.total)}</span><span class="tag">Cycle ${ph.c+1}, week ${ph.cw} of 6</span>${t.blocks?`<span class="tag">${ph.name}${ph.deload?'':', RIR '+ph.rir}</span>`:''}${moved?'<span class="tag">Moved</span>':''}${S.done[d]?'<span class="tag">Complete</span>':''}</div>
    <div class="seg">${segs.map(s=>`<div style="flex:${Math.max(s[1],10)}"><span style="width:${s[2][1]?s[2][0]/s[2][1]*100:0}%"></span></div>`).join('')}</div>
    <div class="seglab">${segs.map(s=>`<span style="flex:${Math.max(s[1],10)}">${s[1]>=20?s[0]+' ':''}${Math.round(s[1])}′</span>`).join('')}</div>
    <div class="hero-actions"><button class="hbtn solid" data-a="colall">${SECS.every(isCol)?'Expand all':'Compact view'}</button><button class="hbtn" data-a="move">Move session</button>${moved?'<button class="hbtn" data-a="unmove">Undo move</button>':''}</div>
  </section>`;
  if(t.blocks){
    const r=readyOf(d);h+=whoopCard(d);
    h+=`<div class="ready"><span>${S.whoop.connected&&!S.ready[d]&&whoopDay(d)&&S.whoop.auto?'From WHOOP':'Recovery'}</span>
      <button class="rbtn ${r==='g'?'on':''}" data-a="ready" data-v="g">Green<small>full session</small></button>
      <button class="rbtn ${r==='y'?'on':''}" data-a="ready" data-v="y">Yellow<small>lighter day</small></button>
      <button class="rbtn ${r==='r'?'on':''}" data-a="ready" data-v="r">Red<small>recovery only</small></button></div>`;
    if(r==='y')h+=`<div class="note"><b>Lighter day.</b> One set fewer on accessories and arms, main lifts stop at 2 reps in reserve, cardio stays Zone 2.</div>`;
    if(r==='r')h+=`<div class="note" style="--c:var(--bad)"><b>Recovery day.</b> Lifting is off today. Do the mobility, core and an easy 30-minute Zone 2. Come back tomorrow fresh.</div>`;
    if(ph.deload)h+=`<div class="note"><b>Deload week.</b> Two sets per exercise, loads about 15% lighter, leave 4 reps in the tank. This is where the gains lock in. A new cycle starts next week.</div>`;
    else h+=`<div class="note"><b>This week: ${ph.focus}.</b> ${[(ph.c>0?'The app suggests starting weights from your strength last cycle. ':'')+'Pick loads that leave '+ph.rir+' reps in reserve. They become your starting point for the cycle.','Keep last week’s weights and add one rep to every set.','Same weights again, one more rep. You should be near the top now.','Add weight (the app suggests how much). Reps drop back down.','Same weight as last week, push for one more rep. The hardest week of the cycle.'][ph.pos]}${ph.pos===0&&ph.c>0?(ph.c%2===1?' <b>New cycle:</b> lower reps, heavier loads, and accessories and arm moves rotate to new variations.':' <b>New cycle:</b> lower reps, heavier loads, and the original accessory moves return.'):''}</div>`;
  }
  if(t.k==='rest')h+=`<div class="note"><b>Rest day.</b> The 10-minute flow below is optional but great for the pelvic tilt and low back. Supplements still count today.</div>`;
  if(t.k==='travel')h+=`<div class="note"><b>Travel session, no equipment.</b> All you need is a sturdy chair, a door frame and a towel.${tripAt(d)&&!S.moves[d]?' Swapped in automatically because this day is inside a trip.':''}</div>`;
  if(t.k==='long')h+=`<div class="note"><b>Active recovery.</b> Keep it conversational the whole way. Nose-breathing pace is perfect.</div>`;
  // mobility
  const mob=mobFor(d);
  h+=secHead('M','Mobility',COLORS.mob,u.mob,mins(est.m),t.k==='rest'?'Optional':'','mob');
  h+=isCol('mob')?csum(mob.map((m,i)=>({l:'M'+(i+1),n:E[m.ex].n,a:isChk(d,m.slot)?1:0,b:1})),COLORS.mob,'mob'):`<div class="mlist" style="--c:${COLORS.mob}">${mob.map(m=>mobRow(d,m,COLORS.mob)).join('')}</div>`;
  // warm-up
  const wu=warmFor(d);
  if(wu.length){
    h+=secHead('W','Warm-up',COLORS.warm,u.wu,mins(est.w),'','wu');
    h+=isCol('wu')?csum(wu.map((m,i)=>({l:'W'+(i+1),n:E[m.ex].n,a:isChk(d,m.slot)?1:0,b:1})),COLORS.warm,'wu'):`<div class="mlist" style="--c:${COLORS.warm}">${wu.map(m=>mobRow(d,m,COLORS.warm)).join('')}</div>`;
  }
  // strength
  const blocks=blocksFor(d);
  if(blocks.length){
    h+=secHead('S','Strength',c,u.str,mins(est.s),'','str');
    h+=isCol('str')?csum(blocks.flatMap(b=>b.items.map((it,i)=>({l:b.label+(b.items.length>1?i+1:''),n:E[it.ex].n,a:setsDone(d,it),b:it.rx.sets}))),c,'str'):blocks.map(b=>blockHTML(d,b,c)).join('');
  }
  // core
  const core=coreFor(d);
  if(core.length){
    h+=secHead('C','Core',COLORS.core,u.core,mins(est.c),'','core');
    if(isCol('core'))h+=csum(core.map((it,i)=>({l:'C'+(i+1),n:E[it.ex].n,a:setsDone(d,it),b:it.rx.sets})),COLORS.core,'core');else h+=`<div class="block ss" style="--c:${COLORS.core}"><div class="sslab"><span>Superset, back to back</span><span>Rest ${core[0].rx.rest} s</span></div>${core.map((it,i)=>exCard(d,it,{label:'C'+(i+1),block:{items:core,key:'core'},c:COLORS.core,idx:i})).join('')}</div>`;
  }
  // cardio
  const cd=cardioFor(d);
  if(cd){
    h+=secHead(cd.long?'L':'Z',cd.long?'Long cardio':'Cardio',cd.long?COLORS.long:COLORS.cardio,u.cardio,mins(cd.mins),'','cardio');
    h+=isCol('cardio')?csum([{l:'Z',n:cd.mins+' min, '+cd.m,a:isChk(d,'cardio')?1:0,b:1}],cd.long?COLORS.long:COLORS.cardio,'cardio'):cardioHTML(d,cd);
  }
  if(t.k!=='rest')h+=`<div class="finish"><button class="cta" style="--c:${S.done[d]?'var(--ok)':c}" data-a="finish">${S.done[d]?IC.check+' Session complete':'Finish session'}</button></div>`;
  v.innerHTML=h;
}
const SECS=['mob','wu','str','core','cardio'];
const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const isCol=k=>!!(S.col&&S.col[k]);
function secHead(letter,name,c,u,time,extra,key){return`<div class="sec ${isCol(key)?'closed':''}"><button class="sechead" style="--c:${c}" data-a="col" data-v="${key}" aria-expanded="${!isCol(key)}"><span class="sq">${letter}</span><h3 class="disp">${name}</h3><span class="cnt num">${u[0]}/${u[1]}${extra?' · '+extra:''}<br>${time}</span><span class="chev">${CHEV}</span></button></div>`}

function exCard(d,it,o){

    else{hh+=`<div class="set ${s.d?'done':''}"><span class="sn">${i+1}</span><label class="fld"><input inputmode="decimal" data-in="w" data-k="${k}" value="${esc(s.w)}" placeholder="${sug?sug.w:'–'}"><em>kg</em></label><label class="fld"><input inputmode="numeric" data-in="r" data-k="${k}" value="${esc(s.r)}" placeholder="${rangeOf(it.rx.reps)[1]}"><em>reps</em></label><button class="tick ${s.d?'on':''}" data-a="set" data-k="${k}" aria-label="Set ${i+1} done">${IC.check}</button></div>`}

  h+=`<div class="card">${cardHead('psched','Weekly schedule')}`;if(!isCol('psched')){h+=`<p class="muted" style="font-size:13.5px;margin:0 0 6px">Change which day each session falls on. It applies to every week; single-day moves are made from the Train tab.</p>`;

  h+=`<div class="legend">${[['Upper','upper'],['Lower','lower'],['Travel','travel'],['Long cardio','long'],['Rest','rest']].map(x=>`<span style="--c:${COLORS[x[1]]}"><i></i>${x[0]}</span>`).join('')}<span style="--c:transparent"><i style="outline:2.5px solid var(--ok)"></i>Done</span></div>`;

  let m=pd(S.start);m.setDate(1);const endM=pd(S.end);

    const y=m.getFullYear(),mo=m.getMonth();const first=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate();

let DEMO=null;
function demoData(){if(DEMO)return DEMO;DEMO={};let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};const t=todayS();

function spark(key,d,n,c){const vals=[];for(let i=n-1;i>=0;i--)vals.push(mval(key,addD(d,-i)));const v=vals.filter(x=>x!=null);if(v.length<2)return'<svg></svg>';const mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1;let pts='';vals.forEach((x,i)=>{if(x==null)return;pts+=`${(i/(n-1)*96+2).toFixed(1)},${(26-(x-mn)/rg*22).toFixed(1)} `});return`<svg viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`}

  const up=[],lo=[];days.forEach(d=>{const k=tplOf(d);if(!k||!S.done[d])return;const v=mval('rec',addD(d,1));if(v==null)return;if(T[k].k==='upper')up.push(v);if(T[k].k==='lower')lo.push(v)});

  return out;

function planDays(){const a=[];for(let d=S.start;d<=S.end;d=addD(d,1))a.push(d);return a}

  const t=todayS();const days=planDays().filter(d=>isTraining(tplOf(d)));
  const past=days.filter(d=>d<t||S.done[d]);const done=past.filter(d=>S.done[d]);

  Object.keys(h).forEach(ex=>{const a=h[ex];if(a.length<2)return;tracked++;const f=Math.max(...a[0].sets.map(s=>e1rm(+s.w,+s.r))),l=Math.max(...a[a.length-1].sets.map(s=>e1rm(+s.w,+s.r)));if(l>f*1.01)up++});
  const prog=tracked?up/tracked:null;
  const reds=planDays().filter(d=>d<=todayS()&&readyOf(d)==='r').length;

function moveSheet(){
  const d=UI.date,cur=tplOf(d),s=sunOf(d);let opts='';

function finishSheet(d){
  const u=units(d),l=S.logs[d]||{};let sets=0,vol=0;Object.keys(l).forEach(k=>{if(k[0]==='_')return;(l[k].sets||[]).forEach(s=>{if(s.d){sets++;vol+=(+s.w||0)*(+s.r||0)}})});
  const dur=l._t0?Math.round((Date.now()-l._t0)/60000):null;const pct=Math.round(pctOf(u)*100);
  const cs=[COLORS.upper,COLORS.lower,COLORS.mob,COLORS.core,COLORS.cardio,COLORS.long];
  openSheet(`<div class="celebrate"><div class="burst">${cs.map((c,i)=>`<i style="--c:${c};animation-delay:${i*60}ms"></i>`).join('')}</div><div class="disp">Session done</div><p class="muted">${T[tplOf(d)].n}, ${nice(d)}</p>

  <button class="cta" style="--c:var(--ok)" data-a="close">Nice</button></div>`);
}

/* ---------- timer ---------- */
let TM=null,AC=null;
function beep(f,len,n){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<(n||1);i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f||880;o.connect(g);g.connect(AC.destination);const t0=AC.currentTime+i*0.22;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.35,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+(len||0.18));o.start(t0);o.stop(t0+(len||0.18)+0.02)}}catch(e){}try{navigator.vibrate&&navigator.vibrate(n>1?[120,80,120]:80)}catch(e){}}
function startTimer(title,phases,done){TM={title,phases,i:0,end:Date.now()+phases[0].s*1000,paused:false,left:0,done};beep(660,.08,1);drawTimer();}
function drawTimer(){
  const el=document.getElementById('timer');if(!TM){el.classList.add('hide');return}el.classList.remove('hide');
  const p=TM.phases[TM.i],rem=TM.paused?TM.left:(TM.end-Date.now())/1000;const C=2*Math.PI*20,frac=Math.max(0,rem)/p.s;
  const nxt=TM.phases[TM.i+1];
  el.innerHTML=`<svg class="ringt" width="50" height="50" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="rgba(127,127,160,.35)" stroke-width="5"/><circle cx="25" cy="25" r="20" fill="none" stroke="${p.c||COLORS.cardio}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" transform="rotate(-90 25 25)"/></svg>
  <div class="tt"><small>${esc(TM.title)}</small><small>${esc(p.l)}${nxt&&TM.phases.length<4?', then '+esc(nxt.l).toLowerCase():''}</small><b class="disp num">${fmtT(rem)}</b></div>
  <button data-a="tadj" data-v="-15">−15</button><button data-a="tadj" data-v="15">+15</button><button data-a="tpause" aria-label="${TM.paused?'Resume':'Pause'}">${TM.paused?'▶':'❚❚'}</button><button data-a="tstop" aria-label="Stop timer">✕</button>`;
}
setInterval(()=>{if(!TM||TM.paused)return;const rem=(TM.end-Date.now())/1000;
  if(rem<=3.05&&rem>0&&Math.ceil(rem)!==TM.lastBeep){TM.lastBeep=Math.ceil(rem);beep(520,.07,1)}
  if(rem<=0){if(TM.i<TM.phases.length-1){TM.i++;TM.end=Date.now()+TM.phases[TM.i].s*1000;TM.lastBeep=null;beep(880,.25,2)}else{const f=TM.done;TM=null;beep(990,.3,3);drawTimer();f&&f();return}}
  drawTimer()},200);

/* ---------- actions ---------- */
function rerender(){HISTCACHE=null;renderTop();renderTabs();({train:renderTrain,whoop:renderWhoop,travel:renderTravel,plan:renderPlan,progress:renderProgress,supps:renderSupps,habits:renderHabits})[UI.tab]();}
function markStart(d){const l=L(d);if(!l._t0)l._t0=Date.now()}
function checkComplete(d){const u=units(d);if(pctOf(u)>=1&&!S.done[d]){S.done[d]={t:Date.now()};save();rerender();finishSheet(d);return true}return false}
function findItem(d,slot){for(const b of blocksFor(d)){for(let i=0;i<b.items.length;i++)if(b.items[i].slot===slot)return{it:b.items[i],b,idx:i}}const c=coreFor(d);for(let i=0;i<c.length;i++)if(c[i].slot===slot)return{it:c[i],b:{items:c},idx:i};return null}
function toggleSet(d,k,forceOn){
  const[slot,i]=k.split('|');const f=findItem(d,slot);if(!f)return;const it=f.it,e=E[it.ex];
  const o=slotLog(d,slot,it.ex,it.rx.sets),s=o.sets[+i];const on=forceOn?true:!s.d;
  if(on){const sg=suggest(it,d);if(!e.t){if(s.r==='')s.r=String(rangeOf(it.rx.reps)[1]);if(!e.bw&&s.w===''&&sg)s.w=String(sg.w)}if(e.t&&s.r==='')s.r=String(secsOf(it))}
  s.d=on?1:0;markStart(d);save();delete UI.exo[slot];
  if(on&&!checkComplete(d)){
    const last=f.idx===f.b.items.length-1;
    if(last){const rest=Math.max(...f.b.items.map(x=>x.rx.rest));const more=+i<it.rx.sets-1;startTimer('Rest',[{l:more?'Set '+(+i+2)+' is next':'Next exercise is up',s:rest,c:COLORS.upper}])}
    else startTimer('Transition',[{l:'Go to '+E[f.b.items[f.idx+1].ex].n,s:15,c:COLORS.core}]);
  }
  rerender();
}
document.addEventListener('click',ev=>{

  case'close':closeSheet();break;
  case'tadj':if(TM){const dv=+el.dataset.v;if(TM.paused)TM.left=Math.max(1,TM.left+dv);else TM.end=Math.max(Date.now()+1000,TM.end+dv*1000);drawTimer()}break;
  case'tpause':if(TM){if(TM.paused){TM.end=Date.now()+TM.left*1000;TM.paused=false}else{TM.left=(TM.end-Date.now())/1000;TM.paused=true}drawTimer()}break;
  case'tstop':TM=null;drawTimer();break;
  case'extend':{const ne=document.getElementById('extEnd').value;if(!ne||ne<=S.end){toast('Pick a date after '+short(S.end));break}const r=analyze().rec;S.ext.push({from:addD(S.end,1),to:ne,vol:r.vol,extra:r.extra,trim:r.trim});S.end=ne;save();rerender();toast('Plan extended to '+short(ne));break}
  case'unextend':{const x=S.ext.pop();if(x){S.end=addD(x.from,-1);save();rerender();toast('Extension removed')}break}
  case'supp':{const t=todayS();S.suppLog[t]=S.suppLog[t]||{};if(S.suppLog[t][k])delete S.suppLog[t][k];else S.suppLog[t][k]=1;save();rerender();break}
  case'suppedit':UI.suppEdit=!UI.suppEdit;rerender();break;
  case'suppopen':suppSheet(k);break;
  case'scol':UI.sdraft.c=el.dataset.v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break;
  case'delsupp':{const i=S.supps.findIndex(s=>s.id===k);if(i<0)break;const rem=S.supps.splice(i,1)[0];save();closeSheet();rerender();toast('Removed '+rem.n,()=>S.supps.splice(i,0,rem));break}
  case'addsupp':suppSheet();break;
  case'suppsave':{const n=document.getElementById('sn').value.trim();if(!n){toast('Add a name first');break}const o={n,d:document.getElementById('sd').value.trim()||'1 serving',slot:document.getElementById('ss').value,note:document.getElementById('snote').value.trim()||'',c:UI.sdraft.c};if(k){Object.assign(S.supps.find(q=>q.id===k),o);toast('Saved '+n)}else{S.supps.push(Object.assign({id:'s'+Date.now()},o));toast('Added '+n)}save();closeSheet();rerender();break}
  case'habtoday':case'habday':{const dd=el.dataset.d||todayS();S.habitLog[k]=S.habitLog[k]||{};if(S.habitLog[k][dd])delete S.habitLog[k][dd];else S.habitLog[k][dd]=1;save();rerender();break}
  case'habopen':UI.hx=UI.hx===k?null:k;rerender();break;
  case'habm':{const cur=UI.hm[k]||todayS().slice(0,7);const[y,m]=cur.split('-').map(Number);const nd=new Date(y,m-1+(+el.dataset.v),1);UI.hm[k]=nd.getFullYear()+'-'+pad(nd.getMonth()+1);rerender();break}
  case'habadd':habSheet(null);break;
  case'habedit':habSheet(k);break;
  case'hemo':UI.hdraft.e=el.dataset.v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break;
  case'hcol':UI.hdraft.c=el.dataset.v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break;
  case'habsave':{const n=document.getElementById('hn').value.trim();if(!n){toast('Give the habit a name');break}if(k){Object.assign(S.habits.find(h=>h.id===k),{n,e:UI.hdraft.e,c:UI.hdraft.c})}else{const id='h'+Date.now();S.habits.push({id,n,e:UI.hdraft.e,c:UI.hdraft.c});UI.hx=id}save();closeSheet();rerender();break}
  case'habdel':{const i=S.habits.findIndex(h=>h.id===k);if(i<0)break;const rem=S.habits.splice(i,1)[0];if(UI.hx===k)UI.hx=null;save();closeSheet();rerender();toast('Deleted '+rem.n,()=>S.habits.splice(i,0,rem));break}
  case'bkcopy':{const tx=document.getElementById('bk');tx.value=JSON.stringify(S);tx.select();try{navigator.clipboard.writeText(tx.value).then(()=>toast('Backup copied'),()=>toast('Select the text and copy it'))}catch(e){toast('Select the text and copy it')}break}
  case'bkrestore':{try{const o=JSON.parse(document.getElementById('bk').value);if(!o||!o.start)throw 0;S=Object.assign(defaults(),o);save();closeSheet();rerender();toast('Backup restored')}catch(e){toast('That text isn\u2019t a valid backup')}break}
  case'reset':if(window.confirm('Delete all logs, habits and settings? This cannot be undone.')){S=defaults();save();closeSheet();UI.date=S.start;rerender()}break;
  }
});
document.addEventListener('change',ev=>{
  const el=ev.target;if(!el.dataset||!el.dataset.in)return;const t=el.dataset.in,k=el.dataset.k,d=UI.date;
  if(t==='w'||t==='r'){const[slot,i]=k.split('|');const f=findItem(d,slot);if(!f)return;const o=slotLog(d,slot,f.it.ex,f.it.rx.sets);o.sets[+i][t]=el.value.replace(',','.').trim();save();HISTCACHE=null}
  else if(t==='map'){S.map[k]=el.value;save();rerender();toast(DN[k]+' is now '+T[el.value].n)}
  else if(t==='start'){if(el.value&&el.value<S.end){S.start=el.value;save();rerender();toast('Plan now starts '+short(el.value))}}
  else if(t==='theme'){applyTheme(el.value);try{localStorage.setItem(KEY+'-theme',el.value)}catch(e){}}
});
function applyTheme(v){if(v==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v)}
try{applyTheme(localStorage.getItem(KEY+'-theme')||'auto')}catch(e){}
(function(){const q=new URLSearchParams(location.search);const w=q.get('whoop');if(w){history.replaceState(null,'',location.pathname);if(w==='connected'){S.whoop.last=0;save();if(!S.whoop.key)setTimeout(()=>toast('WHOOP connected. Go back to the IRON app on your home screen.'),300)}else setTimeout(()=>toast('WHOOP connection failed ('+(q.get('reason')||'unknown')+')'),300)}})();
rerender();
if(WH_ON&&(S.whoop.connected||S.whoop.pending))whoopSync(false);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&WH_ON&&(S.whoop.connected||S.whoop.pending))whoopSync(false)});
window.__S=()=>S;window.__est=estimate;window.__UI=UI;
})();
</script>
